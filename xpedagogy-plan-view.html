<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Pedagogy Plans, Institute View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0D1F35; --navy2:#1F2A3D; --gold:#C9A84C; --parch:#FAF8F3;
    --ink:#0D1F35; --muted:#5b6472; --line:#e4ded1; --card:#ffffff;
    --good:#2f7d4f; --bad:#b23b3b; --slate:#9AA6B4; --faint:#EDE9DE;
  }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--parch);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:19px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .top{background:var(--navy);color:#fff}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
  .brand{display:flex;align-items:center;gap:16px}
  .brand svg{height:34px;width:auto;display:block}
  .brand .rule{width:1px;height:30px;background:rgba(255,255,255,.25)}
  .brand .name{font-family:"Cormorant Garamond",serif;font-size:27px;font-weight:600;letter-spacing:.3px}
  .who{font-family:"DM Mono",monospace;font-size:13px;color:rgba(255,255,255,.7)}
  .who a{color:var(--gold);text-decoration:none;margin-left:14px}

  .login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 34px;box-shadow:0 12px 40px rgba(13,31,53,.08)}
  .login h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:34px;margin:0 0 6px}
  .login p.sub{margin:0 0 26px;color:var(--muted);font-size:16px}
  .oauth{width:100%;background:#fff;color:#3c4043;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-weight:600;font-size:16px;padding:12px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .oauth:hover{background:#f7f7f7}
  .oauth:disabled{opacity:.55;cursor:default}
  .oauth svg{width:19px;height:19px;flex:none}
  .err{color:var(--bad);font-size:14px;margin-top:12px;min-height:18px}

  .intro{padding:34px 0 8px}
  .eyebrow{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
  .intro h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:40px;line-height:1.05;margin:0 0 10px}
  .intro p{margin:0;color:var(--muted);font-size:18px;max-width:66ch}

  .picker{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0 4px}
  .picker label{margin:0;font-weight:600;font-size:14px;color:var(--muted)}
  .picker select{width:auto;min-width:420px;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-family:"DM Mono",monospace;font-size:13px}
  .pill.draft{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .pill.locked{background:#eef4ef;border:1px solid #cfe0d4;color:var(--good)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:18px 0;box-shadow:0 4px 18px rgba(13,31,53,.05);overflow:hidden}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fdfbf6)}
  .card-h h2{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;margin:0}
  .card-h .sub{font-family:"DM Mono",monospace;font-size:13px;color:var(--muted)}
  .card-b{padding:20px 22px}

  .six{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  @media(max-width:820px){.six{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:480px){.six{grid-template-columns:repeat(2,1fr)}}
  .cell{padding:18px 12px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cell:nth-child(6n){border-right:0}
  .cell label{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;min-height:30px;display:flex;align-items:center;justify-content:center}
  .cell .big{font-family:"DM Mono",monospace;font-size:26px;font-weight:600;color:var(--navy)}
  .derived-note{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);margin-top:10px}
  .metaline{margin-top:16px;color:var(--muted);font-size:15px}
  .metaline b{color:var(--navy)}
  .metaline a{color:var(--navy);text-decoration:underline}

  .tbl-scroll{overflow-x:auto}
  table.ledger{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}
  table.ledger th{background:#fbf9f3;text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.3px;padding:9px 10px;border-bottom:1px solid var(--line)}
  table.ledger td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr.assess td{background:#fbf7ee}
  .catchip{display:inline-block;font-family:"DM Mono",monospace;font-size:11px;padding:2px 7px;border-radius:5px;background:var(--faint);color:var(--navy)}
  .catchip.six{background:#efe7cf}
  .tag{font-family:"DM Mono",monospace;font-size:11px;padding:1px 6px;border-radius:5px}
  .tag.new{background:#f6e6e2;color:var(--bad)}
  .tag.ran{background:#e6efe8;color:var(--good)}
  .tag.drop{background:#f6e6e2;color:var(--bad)}
  .tag.pend{background:#eee;color:var(--muted)}

  .cmp{display:grid;grid-template-columns:1fr;gap:10px}
  .cmp .row{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:14px}
  .cmp .row .lab{font-weight:600;font-size:15px}
  .cmp .bar{position:relative;height:26px;background:var(--faint);border-radius:6px;overflow:hidden}
  .cmp .bar .plan{position:absolute;left:0;top:0;bottom:0;background:var(--slate);opacity:.55}
  .cmp .bar .deliv{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
  .cmp .nums{font-family:"DM Mono",monospace;font-size:13px;text-align:right;color:var(--navy)}
  .cmp .nums .v{color:var(--muted)}
  .cmp-legend{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:18px}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}
  .deliv-summary{margin-top:16px;font-size:15px;color:var(--muted)}
  .deliv-summary b{color:var(--navy)}
  .note-line{color:var(--muted);font-size:14px;margin-top:6px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:18px}
  .hidden{display:none}
</style>
</head>

      <p class="eyebrow">Institute view</p>
      <h1>Faculty course plans</h1>
      <p>What each faculty member intends to teach with across a course, and how it compares with what they have delivered so far. Read only.</p>

      <label for="planSel">Course plan</label>
      <select id="planSel"></select>

</div>

<script>
const SUPABASE_URL = "https://qcufrukhfcmyfvwwoqjo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjdWZydWtoZmNteWZ2d3dvcWpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjI0MTEsImV4cCI6MjA5MDY5ODQxMX0.sswZ6e-mCvHznWmu8p7fm0AbRrlaRfM0jvpA2ppNlWI";
const AY = "2026-27";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const SIXMAP = {
  hbi_case:{plan:"planned_cases_hbi", snap:"cases_hbi", label:"HBP cases"},
  other_case:{plan:"planned_cases_other", snap:"cases_other", label:"Other cases"},
  own_case:{plan:"planned_cases_own", snap:"cases_own", label:"Own cases"},
  simulation:{plan:"planned_simulations", snap:"simulations", label:"Simulations"},
  scenario:{plan:"planned_scenarios", snap:"scenarios", label:"Scenarios"},
  live_project:{plan:"planned_live_projects", snap:"live_projects", label:"Live projects"}
};
const SIX = Object.keys(SIXMAP);
const SIXSET = new Set(SIX);
const CATLABEL = { hbi_case:"HBP case", other_case:"Other case", own_case:"Own case",
  simulation:"Simulation", scenario:"Scenario", live_project:"Live project",
  discussion:"Discussion", lecture:"Lecture", assessment:"Assessment", other:"Other" };

let PLANS=[], DETAIL=null;

/* ---------- AUTH ---------- */
$("#googleBtn").addEventListener("click", async ()=>{
  const gb=$("#googleBtn"); $("#loginErr").textContent=""; gb.disabled=true;
  const { error } = await sb.auth.signInWithOAuth({
    provider:"google",
    options:{ redirectTo: window.location.origin + window.location.pathname,
              queryParams:{ hd:"xime.org", prompt:"select_account" } }
  });
  if(error){ $("#loginErr").textContent=error.message; gb.disabled=false; }
});
$("#signout").addEventListener("click", async e=>{ e.preventDefault(); await sb.auth.signOut(); location.reload(); });
sb.auth.getSession().then(({data})=>{ if(data.session) boot(data.session.user.email); });

async function boot(email){
  const { data: fm } = await sb.from("faculty_master").select("name").eq("email",email).maybeSingle();
  const { data: canView } = await sb.rpc("xp_can_view_institute");
  if(!canView){
    $("#loginErr").textContent="Signed in as "+email+". This view is for the President, directors and deans. Your own plan page is at centre.xime.org/xpedagogy-plan.html";
    const gb=$("#googleBtn"); if(gb){ gb.disabled=false; }
    await sb.auth.signOut();
    return;
  }
  $("#loginView").classList.add("hidden");
  $("#appView").classList.remove("hidden");
  $("#whoName").textContent = (fm && fm.name) || email;
  await loadList();
}

async function loadList(){
  const { data } = await sb.rpc("xp_plans_list", { p_academic_year: AY });
  PLANS = data || [];
  const sel = $("#planSel");
  if(!PLANS.length){
    sel.classList.add("hidden");
    $("#detailArea").innerHTML = '<div class="empty">No course plans yet. Once a faculty member creates a plan, it appears here.</div>';
    return;
  }
  sel.classList.remove("hidden");
  sel.innerHTML = PLANS.map(p=>{
    const lab = `${p.campus||"?"} \u00b7 ${p.faculty_name||p.faculty_email} \u00b7 ${p.course_name}  [${p.status}]`;
    return `<option value="${p.course_id}">${esc(lab)}</option>`;
  }).join("");
  sel.addEventListener("change", ()=> loadDetail(sel.value));
  await loadDetail(PLANS[0].course_id);
}

async function loadDetail(courseId){
  $("#detailArea").innerHTML = '<div class="empty">Loading...</div>';
  const { data } = await sb.rpc("xp_plan_detail", { p_course_id: courseId });
  DETAIL = data;
  renderDetail();
}

function plannedSix(){
  const h = DETAIL.header || {};
  const sess = DETAIL.sessions || [];
  if(h.detail_mode==="detailed"){
    const cnt = {}; SIX.forEach(k=>cnt[k]=0);
    sess.forEach(s=>{ if(SIXSET.has(s.method_category)) cnt[s.method_category]++; });
    return SIX.map(k=>cnt[k]);
  }
  return SIX.map(k=> h[SIXMAP[k].plan]||0);
}

function renderDetail(){
  if(!DETAIL || !DETAIL.header){
    $("#detailArea").innerHTML = '<div class="empty">This course has no plan yet.</div>';
    return;
  }
  const h = DETAIL.header, c = DETAIL.course||{}, f = DETAIL.faculty||{}, a = DETAIL.actuals||{};
  const sess = DETAIL.sessions || [];
  const locked = h.status==="locked";
  const detailed = h.detail_mode==="detailed";
  const psix = plannedSix();

  let html = "";

  // header card
  html += '<div class="card"><div class="card-h"><div>'+
          `<h2>${esc(c.course_name||"")}</h2>`+
          `<div class="sub">${esc(f.name||c.faculty_email||"")} \u00b7 ${esc(f.campus||"")}${c.term?(" \u00b7 "+esc(c.term)):""}</div>`+
          '</div>'+
          `<span class="pill ${locked?"locked":"draft"}">${locked?"Locked":"Draft"}</span>`+
          '</div><div class="card-b">';

  html += '<div class="six">';
  SIX.forEach((k,i)=>{
    html += `<div class="cell"><label>${esc(SIXMAP[k].label)}</label><div class="big">${psix[i]}</div></div>`;
  });
  html += '</div>';
  html += `<div class="derived-note">${detailed?"Counted from the session plan below.":"Entered directly by the faculty member (soft plan)."} Discussions, lectures and assessments are logged but are not among the six comparable methods.</div>`;

  html += '<div class="metaline">';
  html += `Planned sessions <b>${h.planned_sessions??"-"}</b>. Mode <b>${detailed?"detailed":"soft"}</b>.`;
  if(h.source_doc_link) html += ` Full outline: <a href="${esc(h.source_doc_link)}" target="_blank" rel="noopener">link</a>.`;
  html += '</div>';
  if(h.plan_note) html += `<div class="metaline">${esc(h.plan_note)}</div>`;
  html += '</div></div>';

  // ledger
  if(detailed && sess.length){
    html += '<div class="card"><div class="card-h"><h2>Session plan</h2><div class="sub">'+sess.length+' rows</div></div><div class="card-b"><div class="tbl-scroll">';
    html += '<table class="ledger"><thead><tr><th>#</th><th>Mod</th><th>Method</th><th>Category</th><th>Artifact</th><th>Materials</th><th>Delivered</th><th>Note</th></tr></thead><tbody>';
    sess.forEach(s=>{
      const six = SIXSET.has(s.method_category);
      const mat = s.materials_ready ? "" : '<span class="tag new">new content</span>';
      const dv = s.delivered===true?'<span class="tag ran">ran</span>':s.delivered===false?'<span class="tag drop">dropped</span>':'<span class="tag pend">not yet</span>';
      html += `<tr class="${s.is_assessment?"assess":""}">`+
        `<td>${s.session_no==null?"MT":s.session_no}</td>`+
        `<td>${s.module_no??""}</td>`+
        `<td>${esc(s.method_type||"")}</td>`+
        `<td><span class="catchip ${six?"six":""}">${esc(CATLABEL[s.method_category]||s.method_category||"")}</span></td>`+
        `<td>${esc(s.artifact_name||"")}</td>`+
        `<td>${mat}</td>`+
        `<td>${dv}</td>`+
        `<td>${esc(s.session_note||"")}</td>`+
        '</tr>';
    });
    html += '</tbody></table></div></div></div>';
  }

  // comparison
  html += '<div class="card"><div class="card-h"><h2>Planned versus delivered</h2></div><div class="card-b">';
  const dsix = SIX.map(k=> a[SIXMAP[k].snap]||0);
  const maxV = Math.max(1, ...psix, ...dsix);
  html += '<div class="cmp">';
  SIX.forEach((k,i)=>{
    html += `<div class="row"><div class="lab">${esc(SIXMAP[k].label)}</div>`+
      `<div class="bar"><div class="plan" style="width:${(psix[i]/maxV*100).toFixed(1)}%"></div><div class="deliv" style="width:${(dsix[i]/maxV*100).toFixed(1)}%"></div></div>`+
      `<div class="nums">planned <b>${psix[i]}</b> &nbsp; delivered <span class="v">${dsix[i]}</span></div></div>`;
  });
  html += '</div>';
  html += '<div class="cmp-legend"><span><span class="sw" style="background:var(--slate);opacity:.55"></span>Planned</span><span><span class="sw" style="background:var(--gold)"></span>Delivered</span></div>';
  if((a.months||0)===0){
    html += '<p class="note-line">No monthly actuals recorded for this course yet. Delivered fills in as the faculty member logs their X-Pedagogy capture.</p>';
  } else {
    html += `<p class="note-line">Delivered is summed across ${a.months} monthly snapshot${a.months===1?"":"s"}.</p>`;
  }
  if(detailed && sess.length){
    const ran = sess.filter(s=>s.delivered===true).length;
    const dropped = sess.filter(s=>s.delivered===false).length;
    const pending = sess.filter(s=>s.delivered===null||s.delivered===undefined).length;
    html += `<div class="deliv-summary">Session delivery: <b>${ran}</b> ran, <b>${dropped}</b> dropped, <b>${pending}</b> not yet marked.`;
    const dn = sess.filter(s=>s.delivered===false && s.artifact_name).map(s=>esc(s.artifact_name));
    if(dn.length) html += ` Dropped: ${dn.join(", ")}.`;
    html += '</div>';
  }
  html += '</div></div>';

  $("#detailArea").innerHTML = html;
}
</script>
</body>
</html>
