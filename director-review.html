<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Hub · Panel Review</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="assets/js/supabase-js-2.105.4.umd.js"></script>
<style>
  :root{
    --navy:#0D1F35;--navy-mid:#1A3352;--navy-l:#243D5C;--navy-dark:#0a1a2e;
    --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#A88A2B;--gold-pale:#F7EDD0;
    --cream:#FAF8F4;--parchment:#FBFAF6;--white:#FFFFFF;
    --text:#0D1F35;--sub:#4A5D72;--muted:#5A6B82;--faint:#7a8699;
    --line:#E5DFD2;--line-strong:#D8D2C5;--border:#D8D2C5;
    --red:#C8102E;--red-l:#F4D5DA;--red-d:#7A1A1A;
    --teal:#0D9268;--teal-l:#6FCDA8;--teal-d:#075B41;--amber:#D97706;--amber-l:#FCE3BC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}

  .topbar{background:var(--navy);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(201,168,76,.25)}
  .tb-l{display:flex;align-items:center;gap:14px}
  .tb-logo{height:26px;width:auto}
  .tb-div{width:1px;height:22px;background:rgba(255,255,255,.15)}
  .tb-title{font-size:13px;font-weight:500;color:rgba(255,255,255,.75);letter-spacing:.04em}
  .tb-r{display:flex;align-items:center;gap:12px}
  .tb-back{font-size:12px;color:rgba(255,255,255,.6);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
  .tb-back:hover{background:rgba(255,255,255,.05);color:white}
  .tb-signout{font-size:12px;color:rgba(255,255,255,.6);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
  .tb-signout:hover{background:rgba(255,255,255,.05);color:white}

  .hero{background:var(--navy);padding:32px 32px 36px;border-bottom:2px solid var(--gold)}
  .hero-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .hero-t{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;color:white;line-height:1.15;margin-bottom:6px}
  .hero-t em{color:var(--gold-l);font-style:italic}
  .hero-s{font-size:13px;color:rgba(255,255,255,.55);max-width:680px;line-height:1.55}
  .hero-tag{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);border-radius:18px;font-size:11px;color:var(--gold-l);font-weight:500;letter-spacing:.04em;margin-top:14px}
  .hero-tag-dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .main{max-width:1180px;margin:0 auto;padding:28px 24px 60px}

  .seg-tabs{display:flex;gap:0;background:white;border:1px solid var(--line-strong);border-radius:10px;padding:4px;width:fit-content;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .seg-tab{padding:9px 18px;font-size:13px;font-weight:500;color:var(--sub);background:transparent;border:none;border-radius:7px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .15s}
  .seg-tab.active{background:var(--navy);color:white}
  .seg-tab:not(.active):hover{background:var(--cream)}
  .seg-tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;padding:0 6px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;border-radius:9px;background:rgba(201,168,76,.18);color:var(--gold-d)}
  .seg-tab.active .seg-tab-count{background:rgba(255,255,255,.18);color:white}

  .fac-list{display:flex;flex-direction:column;gap:10px}
  .fac-empty{padding:48px 32px;background:white;border:1px dashed var(--line-strong);border-radius:12px;text-align:center;color:var(--muted);font-size:13px}
  .fac-empty-icon{font-size:32px;color:var(--faint);margin-bottom:10px;line-height:1}
  .fac-empty-strong{display:block;color:var(--sub);font-weight:500;margin-bottom:4px;font-size:14px}

  .fac-row{background:white;border:1px solid var(--line);border-radius:11px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
  .fac-row:hover{border-color:var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.06);transform:translateY(-1px)}
  .fac-row-l{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fac-row-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--text);line-height:1.15}
  .fac-row-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fac-row-meta-item{display:inline-flex;align-items:center;gap:5px}
  .fac-row-meta-sep{color:var(--line-strong)}
  .fac-row-counts{display:flex;gap:14px;margin-top:4px;font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;letter-spacing:.02em}
  .fac-row-count{display:inline-flex;align-items:center;gap:5px}
  .fac-row-count-n{color:var(--navy);font-weight:600}
  .fac-row-r{display:flex;align-items:center;gap:14px}
  .fac-row-time{font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;text-align:right;line-height:1.4}
  .fac-row-time-l{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:9px;color:var(--faint);margin-bottom:2px}
  .fac-row-chev{font-size:18px;color:var(--gold);line-height:1}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;font-family:'DM Mono',monospace;padding:3px 10px;border-radius:11px;letter-spacing:.03em}
  .pill-dot{width:5px;height:5px;border-radius:50%}
  .pill-pending{background:rgba(217,119,6,.1);color:var(--amber);border:.5px solid rgba(217,119,6,.25)}
  .pill-pending .pill-dot{background:var(--amber)}
  .pill-complete{background:rgba(13,146,104,.1);color:var(--teal);border:.5px solid rgba(13,146,104,.3)}
  .pill-complete .pill-dot{background:var(--teal)}

  .detail{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--cream);z-index:200;overflow-y:auto}
  .detail.open{display:block}
  .detail-bar{background:var(--navy);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(201,168,76,.25)}
  .detail-bar-l{display:flex;align-items:center;gap:14px;color:white}
  .detail-back{font-size:13px;color:rgba(255,255,255,.7);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .detail-back:hover{background:rgba(255,255,255,.05);color:white}
  .detail-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;color:white}
  .detail-meta{font-size:11px;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace}

  .detail-layout{display:grid;grid-template-columns:1fr 400px;gap:0;min-height:calc(100vh - 62px)}
  .detail-content{padding:32px 36px;border-right:1px solid var(--line);overflow-y:auto}
  .detail-panel{background:white;padding:28px 26px;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;border-left:1px solid var(--line)}

  .sec-block{margin-bottom:32px;background:white;border:1px solid var(--line);border-radius:12px;padding:24px 26px}
  .sec-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .sec-n{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold-d);line-height:1;font-weight:500;min-width:34px}
  .sec-h-t{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);line-height:1.15;margin-bottom:3px}
  .sec-h-s{font-size:12px;color:var(--muted);line-height:1.45}

  .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-bottom:14px}
  .data-row{display:flex;flex-direction:column;gap:3px;padding:8px 0}
  .data-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .data-value{font-size:13.5px;color:var(--text);line-height:1.5;word-wrap:break-word;min-height:18px}
  .data-value.empty{color:var(--faint);font-style:italic;font-size:12.5px}

  .narrative-block{margin-top:14px}
  .narrative-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .narrative-t{font-size:13.5px;color:var(--text);line-height:1.6;white-space:pre-wrap;background:var(--cream);padding:12px 14px;border-radius:7px;border:.5px solid var(--line)}

  .entry-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .entry-card{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
  .entry-card-h{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .entry-card-t{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.4;flex:1;min-width:0}
  .entry-card-tag{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:9px;background:rgba(13,31,53,.08);color:var(--navy);font-family:'DM Mono',monospace}
  .entry-card-tag.tier{background:rgba(201,168,76,.16);color:var(--gold-d);border:.5px solid rgba(201,168,76,.4)}
  .entry-card-meta{font-size:11.5px;color:var(--muted);line-height:1.5}
  .entry-card-desc{font-size:12.5px;color:var(--sub);line-height:1.55;font-style:italic;margin-top:5px}

  /* Panel side */
  .panel-h{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.2}
  .panel-s{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:18px}
  .panel-role{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.35);border-radius:14px;font-size:10.5px;color:var(--gold-d);font-family:'DM Mono',monospace;letter-spacing:.06em;font-weight:600;margin-bottom:18px}
  .panel-role-dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .panel-field{margin-bottom:14px}
  .panel-field-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
  .panel-field-l-r{font-size:10px;color:var(--faint);font-weight:500;text-transform:none;letter-spacing:.02em}
  .panel-textarea{width:100%;min-height:120px;padding:11px 13px;border:1px solid var(--line-strong);border-radius:7px;font-family:inherit;font-size:13px;color:var(--text);resize:vertical;line-height:1.55;background:var(--parchment)}
  .panel-textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}

  .panel-banner{padding:12px 14px;border-radius:7px;margin-bottom:14px;font-size:12px;line-height:1.55}
  .panel-banner.complete{background:rgba(13,146,104,.08);border-left:3px solid var(--teal);color:var(--teal-d)}
  .panel-banner strong{font-weight:600;display:block;margin-bottom:3px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:white;padding:12px 22px;border-radius:8px;border-left:3px solid var(--gold);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:300;max-width:480px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);pointer-events:auto;cursor:pointer}

  .blocker{display:none;padding:80px 32px;text-align:center;color:var(--muted);font-size:14px;max-width:520px;margin:0 auto}
  .blocker-h{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--text);margin-bottom:12px;font-weight:500}

  /* ===== One-page performance summary (projectable + printable hero) ===== */
  .op{background:white;border:1px solid var(--gold);border-radius:14px;padding:26px 30px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
  .op-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:18px}
  .op-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--navy);line-height:1.05}
  .op-sub{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:.02em;margin-top:5px}
  .op-ay{font-size:11px;color:var(--gold-d);font-family:'DM Mono',monospace;letter-spacing:.08em;text-align:right;white-space:nowrap}
  .op-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .op-tile{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
  .op-tile-k{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .op-tile-v{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--navy);line-height:1.05;margin-top:3px}
  .op-tile-d{font-size:11px;color:var(--sub);margin-top:1px}
  .op-tile-x{font-size:10.5px;color:var(--gold-d);font-family:'DM Mono',monospace;margin-top:5px}
  .op-high{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:18px}
  .op-high-h{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px;border-bottom:.5px solid var(--line);padding-bottom:3px}
  .op-high-list{list-style:none;margin:0;padding:0}
  .op-high-list li{font-size:12px;color:var(--text);line-height:1.5;padding-left:12px;position:relative;margin-bottom:3px}
  .op-high-list li::before{content:'·';position:absolute;left:2px;color:var(--gold-d);font-weight:700}
  .op-verdict{margin-top:4px;border-top:1px dashed var(--line-strong);padding-top:16px}
  .op-verdict.pending{font-size:12.5px;color:var(--faint);font-style:italic}
  .op-rating{display:flex;align-items:center;gap:12px;margin-bottom:13px}
  .op-rating-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .op-rating-band{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--navy);background:linear-gradient(150deg,var(--gold-pale),rgba(201,168,76,.18));border:1px solid var(--gold);border-radius:9px;padding:4px 18px;line-height:1.15}
  .op-review{margin-bottom:11px}
  .op-review-h{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-d);margin-bottom:4px}
  .op-review-t{font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap}
  .op-members{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:8px}

  .full-divider{display:flex;align-items:center;gap:12px;margin:4px 0 18px;color:var(--faint)}
  .full-divider span{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .full-divider::before,.full-divider::after{content:'';height:1px;background:var(--line);flex:1}

  /* Rating band selector + recorder controls */
  .rate-row{display:flex;flex-direction:column;gap:7px}
  .rate-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line-strong);background:white;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s}
  .rate-opt:hover{border-color:var(--gold)}
  .rate-opt.sel{border-color:var(--gold);background:linear-gradient(150deg,var(--gold-pale),rgba(201,168,76,.16));box-shadow:0 0 0 2px rgba(201,168,76,.18)}
  .rate-opt-b{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--navy)}
  .rate-opt-d{font-size:10.5px;color:var(--muted);font-family:'DM Mono',monospace}
  .panel-input{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:7px;font-family:inherit;font-size:12.5px;color:var(--text);background:var(--parchment)}
  .panel-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
  .panel-record{width:100%;margin-top:8px;padding:14px 18px;background:var(--gold);color:var(--navy);border:none;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:background .15s}
  .panel-record:hover{background:var(--gold-l)}
  .panel-record:disabled{background:var(--line-strong);color:var(--faint);cursor:not-allowed}
  .panel-edit-btn,.panel-cancel{width:100%;margin-top:10px;padding:11px 16px;background:white;border:1px solid var(--line-strong);border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer}
  .panel-edit-btn:hover,.panel-cancel:hover{border-color:var(--gold);color:var(--navy)}
  .panel-recmeta{font-size:10.5px;color:var(--faint);font-family:'DM Mono',monospace;margin-top:10px}
  .ro-text{font-size:12.5px;color:var(--text);line-height:1.55;white-space:pre-wrap;background:var(--cream);border:.5px solid var(--line);border-radius:7px;padding:10px 12px}
  .ro-rating{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ro-rating-l{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .ro-rating-band{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--navy);background:var(--gold-pale);border:1px solid var(--gold);border-radius:7px;padding:2px 14px}

  @media (max-width:900px){
    .detail-layout{grid-template-columns:1fr}
    .detail-panel{position:relative;top:0;height:auto;border-left:none;border-top:2px solid var(--gold);max-height:none}
    .data-grid{grid-template-columns:1fr}
    .hero{padding:24px 18px}
    .main{padding:20px 16px 40px}
    .detail-content{padding:24px 18px}
    .op-tiles{grid-template-columns:repeat(2,1fr)}
    .op-high{grid-template-columns:1fr}
  }

  /* Print: one-page summary only */
  @media print{
    .topbar,.hero,.main,.detail-bar,.detail-panel,#full-detail,.toast{display:none !important}
    .detail{position:static !important;display:block !important;overflow:visible !important;height:auto !important;background:#fff !important}
    .detail-layout{display:block !important}
    .detail-content{display:block !important;overflow:visible !important;border:none !important;padding:0 !important}
    .op{box-shadow:none !important;border:1px solid #bbb !important;margin:0 !important}
    @page{margin:14mm}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-l">
    <img src="assets/logo/XIME_LOGO_WHITE.svg" alt="XIME" class="tb-logo">
    <div class="tb-div"></div>
    <div class="tb-title">X-Hub · Panel Review</div>
  </div>
  <div class="tb-r">
    <button class="tb-back" onclick="window.location.href='index.html'">← Home</button>
    <button class="tb-signout" onclick="signOut()">Sign out</button>
  </div>
</div>

<div class="hero">
  <div class="hero-l" id="hero-l">Panel Review · AY 2025-26</div>
  <div class="hero-t" id="hero-t">Loading...</div>
  <div class="hero-s" id="hero-s">Open a faculty member, project the one-page summary on the screen, and record the panel's agreed review and rating.</div>
  <div class="hero-tag"><div class="hero-tag-dot"></div>AY 2025-26 · Cycle Open</div>
</div>

<div class="main" id="list-view">
  <div class="seg-tabs">
    <button class="seg-tab active" data-seg="to_review" onclick="switchSeg('to_review')">
      To review <span class="seg-tab-count" id="ct-to_review">0</span>
    </button>
    <button class="seg-tab" data-seg="released" onclick="switchSeg('released')">
      Released <span class="seg-tab-count" id="ct-released">0</span>
    </button>
  </div>

  <div class="fac-list" id="fac-list">
    <div class="fac-empty">
      <div class="fac-empty-icon">◇</div>
      <span class="fac-empty-strong">Loading faculty list...</span>
    </div>
  </div>
</div>

<div class="detail" id="detail">
  <div class="detail-bar">
    <div class="detail-bar-l">

function formatDate(s){

}

/* ---------- Access resolution ---------- */
async function resolveAccess(){
  document.getElementById('blocker').style.display='block';
  document.getElementById('blocker-msg').textContent='Verifying access';

  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return null;}

  /* H8 password gate - profile is source of truth, not user_metadata. */
  const{data:profile}=await sb.from('user_profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile){
    document.getElementById('blocker-msg').textContent='Profile not found. Contact admin.';
    return null;
  }
  if(profile.must_change_password===true){
    window.location.href='login.html?action=change-password';
    return null;
  }

  CURRENT_USER=profile;

  const{data:dirRow}=await sb.from('director_campus_map').select('*').eq('email',profile.email).maybeSingle();
  const isSuper=profile.role==='super_admin';

  if(!dirRow){
    if(!isSuper){
      document.getElementById('blocker').querySelector('.blocker-h').textContent='Access denied';
      document.getElementById('blocker-msg').textContent='You are not listed as a director for AY 2025-26. If this is incorrect, contact Girish.';
      return null;
    }
    /* super_admin without director assignment - default to Bengaluru for preview */
    MY_CAMPUS='Bengaluru';
    MY_DIRECTOR_NAME=profile.full_name||profile.email;
  }else{
    MY_CAMPUS=dirRow.campus;
    MY_DIRECTOR_NAME=dirRow.name||profile.full_name||profile.email;
  }

  document.getElementById('blocker').style.display='none';
  return true;
}

/* ---------- List view ----------
   Picker: every faculty member who has submitted, in this campus, regardless of
   any dean step. Deans no longer pre-review; comments are recorded live in the panel. */
async function loadFacultyList(){
  const list=document.getElementById('fac-list');
  list.innerHTML='<div class="fac-empty"><div class="fac-empty-icon">◇</div><span class="fac-empty-strong">Loading...</span></div>';

  const{data:evs,error}=await sb.from('faculty_evaluations')
    .select('*,faculty_master:faculty_master_id(id,name,email,campus,designation,subject_area)')
    .eq('academic_year',ACADEMIC_YEAR)
    .in('workflow_status',['submitted','mid_year_locked','dean_review_in_progress','all_deans_complete','with_director','returned_to_dean','director_verified','complete']);
  if(error){dlog('FAC LIST',error);toast('Failed to load list: '+error.message,false);return;}

  /* Filter to this campus and exclude self-review (director cannot review their own eval) */
  const myEmail=(CURRENT_USER.email||'').toLowerCase();
  const inCampus=(evs||[]).filter(e=>{
    if(e.faculty_master?.campus!==MY_CAMPUS)return false;
    const facEmail=(e.faculty_master?.email||'').toLowerCase();
    if(facEmail&&facEmail===myEmail)return false;
    return true;
  });

  /* Categorise: released (complete) vs to review (everything else submitted) */
  FACULTY_LIST=inCampus.map(ev=>{
    const seg=(ev.workflow_status==='complete')?'released':'to_review';
    return{...ev,seg};
  });

  const counts={to_review:0,released:0};
  FACULTY_LIST.forEach(f=>{counts[f.seg]++;});
  document.getElementById('ct-to_review').textContent=counts.to_review;
  document.getElementById('ct-released').textContent=counts.released;

  renderList();
}

    const stampAt=(f.workflow_status==='complete')?(f.released_to_faculty_at||f.panel_recorded_at):(f.gate1_submitted_at||f.submitted_at||f.updated_at);

    row.innerHTML=`
      <div class="fac-row-l">
        <div class="fac-row-name">${escapeHtml(fm.name||'(unknown)')}</div>
        <div class="fac-row-meta">
          <span class="fac-row-meta-item">${escapeHtml(fm.designation||'')}</span>
          <span class="fac-row-meta-sep">·</span>
          <span class="fac-row-meta-item">${escapeHtml(fm.campus||'')}</span>

          <span class="fac-row-count"><span class="fac-row-count-n">${pubCount}</span> publications</span>
          <span class="fac-row-count"><span class="fac-row-count-n">${epCount}</span> EP</span>
          <span class="fac-row-count"><span class="fac-row-count-n">${srCount}</span> sponsored</span>

/* ---------- Detail view ---------- */
async function openDetail(f){

  const[pubs,eps]=await Promise.all([

function renderDetailContent(f,publications,programmes){
  const c=document.getElementById('d-content');

  /* One-page summary, the hero (projectable + printable) */

/* ---------- One-page performance summary ---------- */
function opTile(k,v,d,extra){
  const t=document.createElement('div');t.className='op-tile';
  const kk=document.createElement('div');kk.className='op-tile-k';kk.textContent=k;
  const vv=document.createElement('div');vv.className='op-tile-v';vv.textContent=v;
  const dd=document.createElement('div');dd.className='op-tile-d';dd.textContent=d;
  t.appendChild(kk);t.appendChild(vv);t.appendChild(dd);
  if(extra){const e=document.createElement('div');e.className='op-tile-x';e.textContent=extra;t.appendChild(e);}
  return t;
}

function opHighList(title,items){
  const b=document.createElement('div');
  const h=document.createElement('div');h.className='op-high-h';h.textContent=title;
  b.appendChild(h);
  const ul=document.createElement('ul');ul.className='op-high-list';
  items.forEach(it=>{const li=document.createElement('li');li.textContent=it;ul.appendChild(li);});
  b.appendChild(ul);
  return b;
}

function buildOnePager(f,publications,programmes){
  const wrap=document.createElement('div');
  wrap.className='op';wrap.id='one-pager';

  /* Header */
  const head=document.createElement('div');head.className='op-head';
  const hl=document.createElement('div');
  const nm=document.createElement('div');nm.className='op-name';nm.textContent=f.snap_name||CURRENT_FAC.name||'(unknown)';
  const sub=document.createElement('div');sub.className='op-sub';
  sub.textContent=[f.snap_designation||CURRENT_FAC.designation,f.snap_campus||CURRENT_FAC.campus,f.snap_subject_area||CURRENT_FAC.subject_area].filter(Boolean).join('  ·  ');
  hl.appendChild(nm);hl.appendChild(sub);
  const ay=document.createElement('div');ay.className='op-ay';ay.textContent='Performance Summary · AY '+ACADEMIC_YEAR;
  head.appendChild(hl);head.appendChild(ay);
  wrap.appendChild(head);

  /* Metrics */
  const pubCount=publications.length;
  const srEntries=Array.isArray(f.sponsored_research_entries)?f.sponsored_research_entries:[];
  const instEntries=Array.isArray(f.institution_entries)?f.institution_entries:[];
  const epCount=programmes.length;
  const epRevenue=programmes.reduce((s,p)=>s+(Number(p.revenue)||0),0);

  const tiles=document.createElement('div');tiles.className='op-tiles';
  tiles.appendChild(opTile('Teaching', f.terms_taught||'Not recorded', 'terms taught'));
  tiles.appendChild(opTile('Research', String(pubCount), pubCount===1?'publication':'publications',
    [(f.h_index!=null&&f.h_index!=='')?('h-index '+f.h_index):'', srEntries.length?(srEntries.length+' sponsored'):''].filter(Boolean).join(' · ')));
  tiles.appendChild(opTile('External Programs', String(epCount), epCount===1?'programme':'programmes',
    epRevenue>0?('Rs '+epRevenue.toLocaleString('en-IN')):''));
  tiles.appendChild(opTile('Institution', String(instEntries.length), instEntries.length===1?'contribution':'contributions'));
  wrap.appendChild(tiles);

  /* Highlights */
  const high=document.createElement('div');high.className='op-high';
  if(publications.length){
    high.appendChild(opHighList('Publications', publications.slice(0,4).map(p=>(p.title||'(untitled)')+(p.year?(' ('+p.year+')'):''))));
  }
  if(programmes.length){
    high.appendChild(opHighList('External programs', programmes.slice(0,4).map(p=>(p.title||'(untitled)')+(p.client?(' — '+p.client):''))));
  }
  if(instEntries.length){
    high.appendChild(opHighList('Institution building', instEntries.slice(0,5).map(e=>e.category||e.description||'(entry)')));
  }
  if(srEntries.length){
    high.appendChild(opHighList('Sponsored research', srEntries.slice(0,3).map(e=>(e.title||'(untitled)')+(e.agency?(' — '+e.agency):''))));
  }
  if(high.children.length)wrap.appendChild(high);

  /* Panel verdict (filled once recorded) */
  const verdict=document.createElement('div');
  if(f.panel_rating){
    verdict.className='op-verdict';
    const r=document.createElement('div');r.className='op-rating';
    const rl=document.createElement('span');rl.className='op-rating-l';rl.textContent='Panel rating';
    const rb=document.createElement('span');rb.className='op-rating-band';rb.textContent=f.panel_rating;
    r.appendChild(rl);r.appendChild(rb);
    verdict.appendChild(r);
    if(f.panel_final_review){
      const fr=document.createElement('div');fr.className='op-review';
      const h=document.createElement('div');h.className='op-review-h';h.textContent='Final panel review';
      const t=document.createElement('div');t.className='op-review-t';t.textContent=f.panel_final_review;
      fr.appendChild(h);fr.appendChild(t);verdict.appendChild(fr);
    }
    if(f.panel_dean_comments){
      const dc=document.createElement('div');dc.className='op-review';
      const h=document.createElement('div');h.className='op-review-h';h.textContent='Dean comments';
      const t=document.createElement('div');t.className='op-review-t';t.textContent=f.panel_dean_comments;
      dc.appendChild(h);dc.appendChild(t);verdict.appendChild(dc);
    }
    if(f.panel_members_present){
      const pm=document.createElement('div');pm.className='op-members';pm.textContent='Panel present: '+f.panel_members_present;
      verdict.appendChild(pm);
    }
  }else{
    verdict.className='op-verdict pending';
    verdict.textContent='Panel decision pending. Record the panel review in the side panel to release the result to the faculty member.';
  }
  wrap.appendChild(verdict);

  return wrap;
}

/* ---------- Section builders (read-only mirror of the submission) ---------- */
function makeSection(num,title,subtitle){
  const sec=document.createElement('div');
  sec.className='sec-block';
  const h=document.createElement('div');h.className='sec-h';
  const n=document.createElement('div');n.className='sec-n';n.textContent=num;
  const wrap=document.createElement('div');
  const ht=document.createElement('div');ht.className='sec-h-t';ht.textContent=title;
  const hs=document.createElement('div');hs.className='sec-h-s';hs.textContent=subtitle;
  wrap.appendChild(ht);wrap.appendChild(hs);
  h.appendChild(n);h.appendChild(wrap);
  sec.appendChild(h);
  return sec;
}

function dataRow(label,value){
  const r=document.createElement('div');r.className='data-row';
  const l=document.createElement('div');l.className='data-label';l.textContent=label;
  const v=document.createElement('div');v.className='data-value';
  if(value===null||value===undefined||value===''){v.classList.add('empty');v.textContent='Not provided';}
  else v.textContent=value;
  r.appendChild(l);r.appendChild(v);
  return r;
}

function narrative(label,text){
  if(!text)return null;
  const w=document.createElement('div');w.className='narrative-block';
  const h=document.createElement('div');h.className='narrative-h';h.textContent=label;
  const t=document.createElement('div');t.className='narrative-t';t.textContent=text;
  w.appendChild(h);w.appendChild(t);
  return w;
}

function buildProfileSection(f){
  const sec=makeSection('01','Profile','From faculty master record and self-reported scholar links');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('Name',f.snap_name||CURRENT_FAC.name));
  grid.appendChild(dataRow('Designation',f.snap_designation||CURRENT_FAC.designation));
  grid.appendChild(dataRow('Campus',f.snap_campus||CURRENT_FAC.campus));
  grid.appendChild(dataRow('Subject Area',f.snap_subject_area||CURRENT_FAC.subject_area));
  grid.appendChild(dataRow('Google Scholar URL',f.scholar_url));
  grid.appendChild(dataRow('ORCID / Scopus ID',f.orcid_id));
  sec.appendChild(grid);
  return sec;
}

function buildTeachingSection(f){
  const sec=makeSection('02','Teaching','Course load and teaching context for AY 2025-26');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('Terms Taught',f.terms_taught));
  grid.appendChild(dataRow('Courses Taught (Digii)',f.snap_courses_taught));
  sec.appendChild(grid);
  const n=narrative('Teaching Notes',f.teaching_notes);
  if(n)sec.appendChild(n);
  return sec;
}

function buildResearchSection(f,publications){
  const sec=makeSection('03','Research & Publications','Publications, indices, and library data sources used');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('H-Index',f.h_index));
  grid.appendChild(dataRow('Google Scholar Citations',f.gscholar_citations));
  grid.appendChild(dataRow('UGC-CARE Listed (legacy)',f.ugc_care_count));
  const ds=Array.isArray(f.data_sources_used)?f.data_sources_used.join(', '):null;
  grid.appendChild(dataRow('Data Sources Used',ds));
  sec.appendChild(grid);
  const wip=narrative('Work in Progress',f.wip_details);
  if(wip)sec.appendChild(wip);
  const ext=narrative('External Resources Needed',f.external_resources_needed);
  if(ext)sec.appendChild(ext);

  if(publications.length>0){
    const h=document.createElement('div');h.className='narrative-h';h.style.marginTop='18px';h.textContent='Publications ('+publications.length+')';
    sec.appendChild(h);
    const list=document.createElement('div');list.className='entry-list';
    publications.forEach(p=>{
      const card=document.createElement('div');card.className='entry-card';
      const hdr=document.createElement('div');hdr.className='entry-card-h';
      const t=document.createElement('div');t.className='entry-card-t';
      t.textContent=(p.publication_type==='conference'?'[Presentation] ':'')+(p.title||'(no title)');
      hdr.appendChild(t);
      const tag=document.createElement('div');tag.className='entry-card-tag';
      tag.textContent=(p.publication_type||'').replace(/_/g,' ').toUpperCase();
      hdr.appendChild(tag);
      if(p.abdc_category==='A*'||p.sjr_quartile==='Q1'){
        const tier=document.createElement('div');tier.className='entry-card-tag tier';
        tier.textContent=p.abdc_category==='A*'?'ABDC A*':'Q1';
        hdr.appendChild(tier);
      }
      card.appendChild(hdr);
      const metaParts=[];
      if(p.year)metaParts.push(p.year);
      if(p.journal_name)metaParts.push(p.journal_name);
      else if(p.book_publisher)metaParts.push(p.book_publisher);
      else if(p.case_publisher)metaParts.push(p.case_publisher);
      else if(p.conference_name)metaParts.push(p.conference_name);
      else if(p.chapter_publisher)metaParts.push(p.chapter_publisher);
      if(p.abdc_category)metaParts.push('ABDC '+p.abdc_category);
      if(p.sjr_quartile)metaParts.push('SJR '+p.sjr_quartile);
      if(p.author_position)metaParts.push((p.author_position||'').replace(/_/g,' '));
      if(p.coauthors)metaParts.push('with '+p.coauthors);
      if(metaParts.length>0){
        const meta=document.createElement('div');meta.className='entry-card-meta';
        meta.textContent=metaParts.join(' · ');
        card.appendChild(meta);
      }
      list.appendChild(card);
    });
    sec.appendChild(list);
  }
  return sec;
}

function buildSponsoredSection(f){
  const sec=makeSection('04','Sponsored Research & Grants','Externally funded projects, consultancy research, and grants');
  const entries=Array.isArray(f.sponsored_research_entries)?f.sponsored_research_entries:[];
  if(entries.length===0){
    const empty=document.createElement('div');empty.className='data-value empty';
    empty.textContent='No sponsored research recorded for this AY.';
    sec.appendChild(empty);
    return sec;
  }
  const list=document.createElement('div');list.className='entry-list';
  entries.forEach(e=>{
    const card=document.createElement('div');card.className='entry-card';
    const hdr=document.createElement('div');hdr.className='entry-card-h';
    const t=document.createElement('div');t.className='entry-card-t';
    t.textContent=e.title||'(untitled)';
    hdr.appendChild(t);
    if(e.status){
      const tag=document.createElement('div');tag.className='entry-card-tag';
      tag.textContent=e.status.toUpperCase();
      hdr.appendChild(tag);
    }
    card.appendChild(hdr);
    const metaParts=[];
    if(e.agency)metaParts.push(e.agency);
    if(e.amount)metaParts.push('Rs '+Number(e.amount).toLocaleString('en-IN'));
    if(e.role)metaParts.push(e.role);
    if(e.duration)metaParts.push(e.duration);
    if(metaParts.length>0){
      const meta=document.createElement('div');meta.className='entry-card-meta';
      meta.textContent=metaParts.join(' · ');
      card.appendChild(meta);
    }
    if(e.description){
      const desc=document.createElement('div');desc.className='entry-card-desc';
      desc.textContent=e.description;
      card.appendChild(desc);
    }
    list.appendChild(card);
  });
  sec.appendChild(list);
  return sec;
}

function buildEpSection(f,programmes){
  const sec=makeSection('05','Industry & EP','Programmes delivered and industry referrals');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('Referrals Sent',f.referrals_sent));
  grid.appendChild(dataRow('Referrals Converted',f.referrals_converted));
  sec.appendChild(grid);
  const refDetail=narrative('Referral Detail',f.referrals_detail);
  if(refDetail)sec.appendChild(refDetail);
  const indSummary=narrative('Industry Summary',f.industry_summary);
  if(indSummary)sec.appendChild(indSummary);

  if(programmes.length>0){
    const h=document.createElement('div');h.className='narrative-h';h.style.marginTop='18px';h.textContent='Programmes Delivered ('+programmes.length+')';
    sec.appendChild(h);
    const list=document.createElement('div');list.className='entry-list';
    programmes.forEach(p=>{
      const card=document.createElement('div');card.className='entry-card';
      const hdr=document.createElement('div');hdr.className='entry-card-h';
      const t=document.createElement('div');t.className='entry-card-t';
      t.textContent=p.title||'(untitled)';
      hdr.appendChild(t);
      if(p.programme_type){
        const tag=document.createElement('div');tag.className='entry-card-tag';
        tag.textContent=p.programme_type;
        hdr.appendChild(tag);
      }
      card.appendChild(hdr);
      const metaParts=[];
      if(p.client)metaParts.push(p.client);
      if(p.date_conducted)metaParts.push(formatDate(p.date_conducted));
      if(p.sessions)metaParts.push(p.sessions+' sessions');
      if(p.participants)metaParts.push(p.participants+' participants');
      if(p.duration)metaParts.push(p.duration);
      if(p.revenue)metaParts.push('Rs '+Number(p.revenue).toLocaleString('en-IN'));
      else metaParts.push('Revenue not entered');
      if(p.role)metaParts.push((p.role||'').replace(/_/g,' '));
      if(metaParts.length>0){
        const meta=document.createElement('div');meta.className='entry-card-meta';
        meta.textContent=metaParts.join(' · ');
        card.appendChild(meta);
      }
      if(p.notes){
        const desc=document.createElement('div');desc.className='entry-card-desc';
        desc.textContent=p.notes;
        card.appendChild(desc);
      }
      list.appendChild(card);
    });
    sec.appendChild(list);
  }
  return sec;
}

function buildInstitutionSection(f){
  const sec=makeSection('06','Institution Building','Categorised contributions across the year');
  const entries=Array.isArray(f.institution_entries)?f.institution_entries:[];
  if(entries.length===0){
    const empty=document.createElement('div');empty.className='data-value empty';
    empty.textContent='No institution building entries recorded for this AY.';
    sec.appendChild(empty);
    return sec;
  }
  const list=document.createElement('div');list.className='entry-list';
  entries.forEach(e=>{
    const card=document.createElement('div');card.className='entry-card';
    const hdr=document.createElement('div');hdr.className='entry-card-h';
    const t=document.createElement('div');t.className='entry-card-t';
    t.textContent=e.category||'(uncategorised)';
    hdr.appendChild(t);
    if(e.role){
      const tag=document.createElement('div');tag.className='entry-card-tag tier';
      tag.textContent=e.role;
      hdr.appendChild(tag);
    }
    card.appendChild(hdr);
    if(e.description){
      const desc=document.createElement('div');desc.className='entry-card-desc';
      desc.style.fontStyle='normal';desc.style.color='var(--sub)';
      desc.textContent=e.description;
      card.appendChild(desc);
    }
    if(e.date){
      const meta=document.createElement('div');meta.className='entry-card-meta';
      meta.style.marginTop='4px';
      meta.textContent=e.date;
      card.appendChild(meta);
    }
    list.appendChild(card);
  });
  sec.appendChild(list);
  return sec;
}

/* ---------- Panel recorder ---------- */
function panelTextField(id,label,labelR,val,ph){
  const cf=document.createElement('div');cf.className='panel-field';
  const cl=document.createElement('div');cl.className='panel-field-l';
  cl.innerHTML='<span>'+escapeHtml(label)+'</span><span class="panel-field-l-r">'+escapeHtml(labelR)+'</span>';
  const ta=document.createElement('textarea');ta.className='panel-textarea';ta.id=id;ta.placeholder=ph||'';ta.value=val||'';
  cf.appendChild(cl);cf.appendChild(ta);
  return cf;
}

function appendReadonlyField(p,label,val){
  if(!val)return;
  const cf=document.createElement('div');cf.className='panel-field';
  const cl=document.createElement('div');cl.className='panel-field-l';cl.innerHTML='<span>'+escapeHtml(label)+'</span>';
  const t=document.createElement('div');t.className='ro-text';t.textContent=val;
  cf.appendChild(cl);cf.appendChild(t);
  p.appendChild(cf);
}

function renderPanel(f){
  const p=document.getElementById('d-panel');
  p.innerHTML='';
  const released=(f.workflow_status==='complete');
  const editing=(p._editing===true);

  const h=document.createElement('div');h.className='panel-h';h.textContent='Panel Review';
  p.appendChild(h);
  const role=document.createElement('div');role.className='panel-role';
  role.innerHTML='<span class="panel-role-dot"></span>Director · '+escapeHtml(MY_CAMPUS);
  p.appendChild(role);

  /* Released, read-only view */
  if(released&&!editing){
    const b=document.createElement('div');b.className='panel-banner complete';
    b.innerHTML='<strong>Released to faculty.</strong>'+(f.released_to_faculty_at?('Released '+formatDateTime(f.released_to_faculty_at)+'. '):'')+'The faculty member can see the panel result.';
    p.appendChild(b);
    if(f.panel_rating){
      const rr=document.createElement('div');rr.className='ro-rating';
      rr.innerHTML='<span class="ro-rating-l">Rating</span><span class="ro-rating-band">'+escapeHtml(f.panel_rating)+'</span>';
      p.appendChild(rr);
    }
    appendReadonlyField(p,'Final panel review',f.panel_final_review);
    appendReadonlyField(p,'Dean comments',f.panel_dean_comments);
    appendReadonlyField(p,'Panel present',f.panel_members_present);
    const meta=document.createElement('div');meta.className='panel-recmeta';
    meta.textContent=[f.panel_recorded_by_name?('Recorded by '+f.panel_recorded_by_name):'',f.panel_recorded_at?formatDateTime(f.panel_recorded_at):''].filter(Boolean).join(' · ');
    p.appendChild(meta);
    const edit=document.createElement('button');edit.className='panel-edit-btn';edit.textContent='Revise this review';
    edit.onclick=()=>{p._editing=true;renderPanel(f);};
    p.appendChild(edit);
    return;
  }

  /* Editable recorder */
  const s=document.createElement('div');s.className='panel-s';
  s.textContent=released
    ? 'Revise the recorded panel review. Saving re-releases the updated result to the faculty member.'
    : 'Record what the panel agrees, then release to the faculty member. This becomes their final panel-approved result.';
  p.appendChild(s);

  p.appendChild(panelTextField('panel-dean','Dean comments','Dean Academics',f.panel_dean_comments||"","The dean's read on the year, as agreed in the room."));
  p.appendChild(panelTextField('panel-review','Final panel review','visible to faculty',f.panel_final_review||"",'The panel-approved verdict the faculty member will see.'));

  /* Rating band */
  SELECTED_RATING=f.panel_rating||null;
  const rf=document.createElement('div');rf.className='panel-field';
  const rl=document.createElement('div');rl.className='panel-field-l';
  rl.innerHTML='<span>Panel rating</span><span class="panel-field-l-r">agreed band</span>';
  rf.appendChild(rl);
  const row=document.createElement('div');row.className='rate-row';
  RATING_BANDS.forEach(([band,desc])=>{
    const o=document.createElement('button');o.type='button';
    o.className='rate-opt'+(SELECTED_RATING===band?' sel':'');
    o.innerHTML='<span class="rate-opt-b">'+escapeHtml(band)+'</span><span class="rate-opt-d">'+escapeHtml(desc)+'</span>';
    o.onclick=()=>{SELECTED_RATING=band;row.querySelectorAll('.rate-opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');};
    row.appendChild(o);
  });
  rf.appendChild(row);
  p.appendChild(rf);

  /* Panel present (optional) */
  const mf=document.createElement('div');mf.className='panel-field';
  const ml=document.createElement('div');ml.className='panel-field-l';
  ml.innerHTML='<span>Panel present</span><span class="panel-field-l-r">optional</span>';
  const mi=document.createElement('input');mi.type='text';mi.className='panel-input';mi.id='panel-members';
  mi.placeholder='e.g. Dean Academics, Director, President, Chairman';
  mi.value=f.panel_members_present||'';
  mf.appendChild(ml);mf.appendChild(mi);
  p.appendChild(mf);

  const btn=document.createElement('button');btn.className='panel-record';btn.id='panel-record-btn';
  btn.textContent=released?'Update and re-release':'Record panel review and release';
  btn.onclick=recordPanelReview;
  p.appendChild(btn);

  if(released){
    const cancel=document.createElement('button');cancel.className='panel-cancel';cancel.textContent='Cancel';
    cancel.onclick=()=>{p._editing=false;renderPanel(f);};
    p.appendChild(cancel);
  }
}

async function recordPanelReview(){
  if(!CURRENT_EVAL){return;}
  const dean=(document.getElementById('panel-dean').value||'').trim();
  const review=(document.getElementById('panel-review').value||'').trim();
  const members=(document.getElementById('panel-members').value||'').trim();
  const rating=SELECTED_RATING;

  if(!rating){toast('Select the panel rating band before releasing.',false);return;}
  if(!review){toast('Write the final panel review before releasing.',false);return;}
  if(!confirm('Release the panel review for '+(CURRENT_FAC.name||'this faculty member')+'? They will see this as their final panel-approved result.'))return;

  const btn=document.getElementById('panel-record-btn');
  const orig=btn.textContent;btn.textContent='Releasing...';btn.disabled=true;

  try{
    const now=new Date().toISOString();
    const payload={
      panel_dean_comments:dean||null,
      panel_final_review:review,
      panel_rating:rating,
      panel_members_present:members||null,
      panel_recorded_by:CURRENT_USER.email,
      panel_recorded_by_name:MY_DIRECTOR_NAME,
      panel_recorded_at:now,
      workflow_status:'complete',
      released_to_faculty_at:now,
      updated_at:now
    };
    const{error}=await sb.from('faculty_evaluations').update(payload).eq('id',CURRENT_EVAL.id);
    if(error)throw error;

    Object.assign(CURRENT_EVAL,payload);
    const p=document.getElementById('d-panel');p._editing=false;
    toast('Panel review released to faculty.');
    renderDetailContent(CURRENT_EVAL,LAST_PUBS,LAST_PROGS);
    renderPanel(CURRENT_EVAL);
  }catch(e){
    dlog('RECORD PANEL',e);
    const code=e.code?` [${e.code}]`:'';
    toast('Release failed'+code+': '+(e.message||'unknown')+'. Tell Girish.',false);
    btn.textContent=orig;btn.disabled=false;
  }
}

/* ---------- Init ---------- */
async function init(){
  const access=await resolveAccess();
  if(!access)return;

  document.getElementById('hero-t').innerHTML='Welcome, <em>'+escapeHtml(MY_DIRECTOR_NAME)+'</em>';
  document.getElementById('hero-l').textContent=`Director · ${MY_CAMPUS} · AY 2025-26`;

  await loadFacultyList();
}

init();
</script>
