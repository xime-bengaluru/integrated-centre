<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Hub · Director Review</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="assets/js/supabase-js-2.105.4.umd.js"></script>
<style>
  :root{
    --navy:#0D1F35;--navy-mid:#1A3352;--navy-l:#243D5C;--navy-dark:#0a1a2e;
    --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#A88A2B;--gold-pale:#F7EDD0;
    --cream:#FAF8F4;--parchment:#FBFAF6;--white:#FFFFFF;
    --text:#0D1F35;--sub:#4A5D72;--muted:#5A6B82;--faint:#7a8699;
    --line:#E5DFD2;--line-strong:#D8D2C5;--border:#D8D2C5;
    --red:#C8102E;--red-l:#F4D5DA;--red-d:#7A1A1A;
    --teal:#0D9268;--teal-l:#6FCDA8;--teal-d:#075B41;--amber:#D97706;--amber-l:#FCE3BC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}

  .topbar{background:var(--navy);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(201,168,76,.25)}
  .tb-l{display:flex;align-items:center;gap:14px}
  .tb-logo{height:26px;width:auto}
  .tb-div{width:1px;height:22px;background:rgba(255,255,255,.15)}
  .tb-title{font-size:13px;font-weight:500;color:rgba(255,255,255,.75);letter-spacing:.04em}
  .tb-r{display:flex;align-items:center;gap:12px}
  .tb-back{font-size:12px;color:rgba(255,255,255,.6);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
  .tb-back:hover{background:rgba(255,255,255,.05);color:white}
  .tb-signout{font-size:12px;color:rgba(255,255,255,.6);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
  .tb-signout:hover{background:rgba(255,255,255,.05);color:white}

  .hero{background:var(--navy);padding:32px 32px 36px;border-bottom:2px solid var(--gold)}
  .hero-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .hero-t{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;color:white;line-height:1.15;margin-bottom:6px}
  .hero-t em{color:var(--gold-l);font-style:italic}
  .hero-s{font-size:13px;color:rgba(255,255,255,.55);max-width:680px;line-height:1.55}
  .hero-tag{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);border-radius:18px;font-size:11px;color:var(--gold-l);font-weight:500;letter-spacing:.04em;margin-top:14px}
  .hero-tag-dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .main{max-width:1180px;margin:0 auto;padding:28px 24px 60px}

  .seg-tabs{display:flex;gap:0;background:white;border:1px solid var(--line-strong);border-radius:10px;padding:4px;width:fit-content;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .seg-tab{padding:9px 18px;font-size:13px;font-weight:500;color:var(--sub);background:transparent;border:none;border-radius:7px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .15s}
  .seg-tab.active{background:var(--navy);color:white}
  .seg-tab:not(.active):hover{background:var(--cream)}
  .seg-tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;padding:0 6px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;border-radius:9px;background:rgba(201,168,76,.18);color:var(--gold-d)}
  .seg-tab.active .seg-tab-count{background:rgba(255,255,255,.18);color:white}

  .fac-list{display:flex;flex-direction:column;gap:10px}
  .fac-empty{padding:48px 32px;background:white;border:1px dashed var(--line-strong);border-radius:12px;text-align:center;color:var(--muted);font-size:13px}
  .fac-empty-icon{font-size:32px;color:var(--faint);margin-bottom:10px;line-height:1}
  .fac-empty-strong{display:block;color:var(--sub);font-weight:500;margin-bottom:4px;font-size:14px}

  .fac-row{background:white;border:1px solid var(--line);border-radius:11px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
  .fac-row:hover{border-color:var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.06);transform:translateY(-1px)}
  .fac-row-l{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fac-row-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--text);line-height:1.15}
  .fac-row-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fac-row-meta-item{display:inline-flex;align-items:center;gap:5px}
  .fac-row-meta-sep{color:var(--line-strong)}
  .fac-row-counts{display:flex;gap:14px;margin-top:4px;font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;letter-spacing:.02em}
  .fac-row-count{display:inline-flex;align-items:center;gap:5px}
  .fac-row-count-n{color:var(--navy);font-weight:600}
  .fac-row-r{display:flex;align-items:center;gap:14px}
  .fac-row-time{font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;text-align:right;line-height:1.4}
  .fac-row-time-l{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:9px;color:var(--faint);margin-bottom:2px}
  .fac-row-chev{font-size:18px;color:var(--gold);line-height:1}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;font-family:'DM Mono',monospace;padding:3px 10px;border-radius:11px;letter-spacing:.03em}
  .pill-dot{width:5px;height:5px;border-radius:50%}
  .pill-pending{background:rgba(217,119,6,.1);color:var(--amber);border:.5px solid rgba(217,119,6,.25)}
  .pill-pending .pill-dot{background:var(--amber)}
  .pill-returned{background:rgba(200,16,46,.08);color:var(--red);border:.5px solid rgba(200,16,46,.25)}
  .pill-returned .pill-dot{background:var(--red)}
  .pill-verified{background:rgba(13,146,104,.1);color:var(--teal);border:.5px solid rgba(13,146,104,.3)}
  .pill-verified .pill-dot{background:var(--teal)}
  .pill-complete{background:rgba(13,31,53,.08);color:var(--navy);border:.5px solid rgba(13,31,53,.18)}
  .pill-complete .pill-dot{background:var(--navy)}

  .detail{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--cream);z-index:200;overflow-y:auto}
  .detail.open{display:block}
  .detail-bar{background:var(--navy);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(201,168,76,.25)}
  .detail-bar-l{display:flex;align-items:center;gap:14px;color:white}
  .detail-back{font-size:13px;color:rgba(255,255,255,.7);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .detail-back:hover{background:rgba(255,255,255,.05);color:white}
  .detail-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;color:white}
  .detail-meta{font-size:11px;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace}

  .detail-layout{display:grid;grid-template-columns:1fr 400px;gap:0;min-height:calc(100vh - 62px)}
  .detail-content{padding:32px 36px;border-right:1px solid var(--line);overflow-y:auto}
  .detail-panel{background:white;padding:28px 26px;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;border-left:1px solid var(--line)}

  .sec-block{margin-bottom:32px;background:white;border:1px solid var(--line);border-radius:12px;padding:24px 26px}
  .sec-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .sec-n{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold-d);line-height:1;font-weight:500;min-width:34px}
  .sec-h-t{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);line-height:1.15;margin-bottom:3px}
  .sec-h-s{font-size:12px;color:var(--muted);line-height:1.45}

  .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-bottom:14px}
  .data-row{display:flex;flex-direction:column;gap:3px;padding:8px 0}
  .data-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .data-value{font-size:13.5px;color:var(--text);line-height:1.5;word-wrap:break-word;min-height:18px}
  .data-value.empty{color:var(--faint);font-style:italic;font-size:12.5px}

  .narrative-block{margin-top:14px}
  .narrative-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .narrative-t{font-size:13.5px;color:var(--text);line-height:1.6;white-space:pre-wrap;background:var(--cream);padding:12px 14px;border-radius:7px;border:.5px solid var(--line)}

  .entry-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .entry-card{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
  .entry-card-h{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .entry-card-t{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.4;flex:1;min-width:0}
  .entry-card-tag{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:9px;background:rgba(13,31,53,.08);color:var(--navy);font-family:'DM Mono',monospace}
  .entry-card-tag.tier{background:rgba(201,168,76,.16);color:var(--gold-d);border:.5px solid rgba(201,168,76,.4)}
  .entry-card-meta{font-size:11.5px;color:var(--muted);line-height:1.5}
  .entry-card-desc{font-size:12.5px;color:var(--sub);line-height:1.55;font-style:italic;margin-top:5px}

  /* Dean Reviews Summary block (prominent, top of detail content) */
  .deans-block{margin-bottom:32px;background:linear-gradient(180deg,rgba(201,168,76,.06),rgba(201,168,76,.02));border:1px solid rgba(201,168,76,.35);border-radius:12px;padding:24px 26px}
  .deans-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed rgba(201,168,76,.35)}
  .deans-h-t{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);line-height:1.15;margin-bottom:3px}
  .deans-h-s{font-size:12px;color:var(--muted);line-height:1.45}
  .deans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:900px){.deans-grid{grid-template-columns:1fr}}
  .dean-card{background:white;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:130px}
  .dean-card.complete{border-color:rgba(13,146,104,.35);background:rgba(13,146,104,.03)}
  .dean-card.pending-c{border-color:rgba(217,119,6,.3);background:rgba(217,119,6,.03)}
  .dean-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .dean-card-role{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-d)}
  .dean-card-name{font-size:13px;font-weight:500;color:var(--text);margin-top:2px;line-height:1.3}
  .dean-card-status{font-size:9.5px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:9px;font-family:'DM Mono',monospace;text-transform:uppercase}
  .dean-card-status.ok{background:rgba(13,146,104,.12);color:var(--teal-d)}
  .dean-card-status.wait{background:rgba(217,119,6,.12);color:var(--amber)}
  .dean-card-notes{font-size:12.5px;color:var(--sub);line-height:1.55;background:var(--cream);padding:9px 11px;border-radius:6px;border:.5px solid var(--line);white-space:pre-wrap}
  .dean-card-notes.empty{color:var(--faint);font-style:italic;font-size:11.5px}
  .dean-card-foot{font-size:10.5px;color:var(--faint);font-family:'DM Mono',monospace;margin-top:auto}

  /* Revenue verification strip */
  .rev-strip{margin-top:14px;padding:11px 14px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:12.5px}
  .rev-strip.ok{background:rgba(13,146,104,.06);border:1px solid rgba(13,146,104,.25);color:var(--teal-d)}
  .rev-strip.flag{background:rgba(200,16,46,.05);border:1px solid rgba(200,16,46,.25);color:var(--red-d)}
  .rev-strip.na{background:rgba(122,134,153,.06);border:1px dashed rgba(122,134,153,.3);color:var(--muted)}
  .rev-strip-icon{font-size:14px;line-height:1}
  .rev-strip-text strong{font-weight:600}

  /* Director Performance Assessment block */
  .assess-block{margin-bottom:32px;background:white;border:1px solid var(--line);border-radius:12px;padding:24px 26px}
  .assess-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .assess-n{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold-d);line-height:1;font-weight:500;min-width:30px}
  .assess-h-t{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);line-height:1.15;margin-bottom:3px}
  .assess-h-s{font-size:12px;color:var(--muted);line-height:1.45}
  .assess-grid{display:grid;grid-template-columns:148px 1fr 1fr 1fr;gap:9px 12px;align-items:center}
  .assess-colh{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:center}
  .assess-area{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.3}
  .assess-area-na{font-size:10.5px;color:var(--faint);font-style:italic;margin-top:2px}
  .assess-seg{display:flex;gap:3px}
  .assess-b{flex:1;font-size:11px;padding:6px 0;text-align:center;border:1px solid var(--line-strong);background:white;color:var(--sub);cursor:pointer;border-radius:6px;font-family:inherit;transition:all .12s}
  .assess-b:hover{border-color:var(--gold)}
  .assess-b.on{background:var(--navy);color:white;border-color:var(--navy);font-weight:600}
  .assess-b.na.on{background:var(--faint);border-color:var(--faint)}
  .assess-comment{width:100%;min-height:72px;margin-top:16px;padding:11px 13px;border:1px solid var(--line-strong);border-radius:7px;font-family:inherit;font-size:13px;color:var(--text);resize:vertical;line-height:1.55;background:var(--parchment)}
  .assess-comment:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}
  .assess-foot{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
  .assess-save{padding:11px 22px;background:var(--gold-d);color:white;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
  .assess-save:hover{background:var(--gold)}
  .assess-save:disabled{opacity:.55;cursor:not-allowed}
  .assess-note{font-size:11px;color:var(--muted);line-height:1.4}
  @media (max-width:900px){.assess-grid{grid-template-columns:104px 1fr 1fr 1fr;gap:7px 6px}.assess-b{font-size:10px;padding:5px 0}}

  /* Panel */
  .panel-h{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.2}
  .panel-s{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:18px}
  .panel-role{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.35);border-radius:14px;font-size:10.5px;color:var(--gold-d);font-family:'DM Mono',monospace;letter-spacing:.06em;font-weight:600;margin-bottom:18px}
  .panel-role-dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .panel-field{margin-bottom:14px}
  .panel-field-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
  .panel-field-l-r{font-size:10px;color:var(--faint);font-weight:500;text-transform:none;letter-spacing:.02em}
  .panel-textarea{width:100%;min-height:130px;padding:11px 13px;border:1px solid var(--line-strong);border-radius:7px;font-family:inherit;font-size:13px;color:var(--text);resize:vertical;line-height:1.55;background:var(--parchment)}
  .panel-textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}

  /* Action buttons */
  .panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .pa-btn{padding:13px 14px;border:1px solid var(--line-strong);background:white;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;letter-spacing:.02em;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
  .pa-btn-sub{font-size:10px;font-weight:400;color:var(--faint);letter-spacing:0}
  .pa-btn.verify{background:var(--teal);color:white;border-color:var(--teal)}
  .pa-btn.verify:hover{background:var(--teal-d);border-color:var(--teal-d)}
  .pa-btn.verify .pa-btn-sub{color:rgba(255,255,255,.7)}
  .pa-btn.return{background:white;color:var(--red);border-color:var(--red)}
  .pa-btn.return:hover{background:rgba(200,16,46,.05)}
  .pa-btn:disabled{opacity:.55;cursor:not-allowed}

  /* Status banner */
  .panel-banner{padding:12px 14px;border-radius:7px;margin-bottom:14px;font-size:12px;line-height:1.55}
  .panel-banner.verified{background:rgba(13,146,104,.08);border-left:3px solid var(--teal);color:var(--teal-d)}
  .panel-banner.returned{background:rgba(200,16,46,.06);border-left:3px solid var(--red);color:var(--red-d)}
  .panel-banner.complete{background:rgba(13,31,53,.06);border-left:3px solid var(--navy);color:var(--navy)}
  .panel-banner strong{font-weight:600;display:block;margin-bottom:3px}

  /* Action history */
  .panel-hist{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
  .panel-hist-h{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .hist-entry{padding:9px 11px;background:var(--cream);border:.5px solid var(--line);border-radius:6px;margin-bottom:6px;font-size:11.5px;line-height:1.5}
  .hist-action{display:inline-block;font-family:'DM Mono',monospace;font-size:9.5px;font-weight:600;padding:1px 7px;border-radius:8px;letter-spacing:.04em;margin-right:6px}
  .hist-action.verify{background:rgba(13,146,104,.12);color:var(--teal-d)}
  .hist-action.return{background:rgba(200,16,46,.1);color:var(--red-d)}
  .hist-meta{color:var(--faint);font-size:10.5px;font-family:'DM Mono',monospace;margin-top:3px}
  .hist-notes{color:var(--sub);margin-top:4px;font-size:11.5px;line-height:1.5;white-space:pre-wrap}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:white;padding:12px 22px;border-radius:8px;border-left:3px solid var(--gold);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:300;max-width:480px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);pointer-events:auto;cursor:pointer}

  .blocker{display:none;padding:80px 32px;text-align:center;color:var(--muted);font-size:14px;max-width:520px;margin:0 auto}
  .blocker-h{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--text);margin-bottom:12px;font-weight:500}

  @media (max-width:900px){
    .detail-layout{grid-template-columns:1fr}
    .detail-panel{position:relative;top:0;height:auto;border-left:none;border-top:2px solid var(--gold);max-height:none}
    .data-grid{grid-template-columns:1fr}
    .hero{padding:24px 18px}
    .main{padding:20px 16px 40px}
    .detail-content{padding:24px 18px}
  }
</style>
</head>
<body>

function escapeHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function toast(m,ok=true){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.style.borderLeftColor=ok?'var(--gold)':'var(--red)';
  t.style.background=ok?'var(--navy-dark)':'#7A1A1A';
  t.classList.add('show');
  if(t._timer)clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.classList.remove('show');t.style.background='';},ok?3000:9000);
  t.onclick=()=>{t.classList.remove('show');t.style.background='';};
}

async function signOut(){

function formatDate(s){
  if(!s)return '—';
  try{return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
  catch(e){return s;}
}

function formatDateTime(s){
  if(!s)return '—';
  try{return new Date(s).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});}
  catch(e){return s;}
}

function timeAgo(s){
  if(!s)return '';
  try{
    const d=new Date(s);
    const diff=Math.floor((Date.now()-d.getTime())/1000);
    if(diff<60)return 'just now';
    if(diff<3600)return Math.floor(diff/60)+'m ago';
    if(diff<86400)return Math.floor(diff/3600)+'h ago';
    return Math.floor(diff/86400)+'d ago';
  }catch(e){return '';}
}

/* ---------- Access resolution ---------- */
async function resolveAccess(){
  document.getElementById('blocker').style.display='block';
  document.getElementById('blocker-msg').textContent='Verifying access';

  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return null;}

  const um=session.user.user_metadata||{};
  if(um.must_change_password===true){
    window.location.href='login.html?action=change-password';
    return null;
  }

  const{data:profile}=await sb.from('user_profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile){
    document.getElementById('blocker-msg').textContent='Profile not found. Contact admin.';
    return null;
  }
  if(profile.must_change_password===true){
    window.location.href='login.html?action=change-password';
    return null;
  }

  CURRENT_USER=profile;

  const{data:dirRow}=await sb.from('director_campus_map').select('*').eq('email',profile.email).maybeSingle();
  const isSuper=profile.role==='super_admin';

  if(!dirRow){
    if(!isSuper){
      document.getElementById('blocker').querySelector('.blocker-h').textContent='Access denied';
      document.getElementById('blocker-msg').textContent='You are not listed as a director for AY 2025-26. If this is incorrect, contact Girish.';
      return null;
    }
    /* super_admin without director assignment - default to Bengaluru for preview */
    MY_CAMPUS='Bengaluru';
    MY_DIRECTOR_NAME=profile.full_name||profile.email;
  }else{
    MY_CAMPUS=dirRow.campus;
    MY_DIRECTOR_NAME=dirRow.name||profile.full_name||profile.email;
  }

  document.getElementById('blocker').style.display='none';
  return true;
}

/* ---------- List view ---------- */
async function loadFacultyList(){
  const list=document.getElementById('fac-list');
  list.innerHTML='<div class="fac-empty"><div class="fac-empty-icon">◇</div><span class="fac-empty-strong">Loading...</span></div>';

  /* Pull evaluations that have reached director-relevant states */
  const{data:evs,error}=await sb.from('faculty_evaluations')
    .select('*,faculty_master:faculty_master_id(id,name,email,campus,designation,subject_area)')
    .eq('academic_year',ACADEMIC_YEAR)
    .in('workflow_status',['all_deans_complete','with_director','returned_to_dean','director_verified','complete']);
  if(error){dlog('FAC LIST',error);toast('Failed to load list: '+error.message,false);return;}

  /* Filter to this campus and exclude self-review (director cannot verify their own eval) */
  const myEmail=(CURRENT_USER.email||'').toLowerCase();
  const inCampus=(evs||[]).filter(e=>{
    if(e.faculty_master?.campus!==MY_CAMPUS)return false;
    const facEmail=(e.faculty_master?.email||'').toLowerCase();
    if(facEmail&&facEmail===myEmail)return false;
    return true;
  });

  /* Fetch existing director review rows in one go */
  const evalIds=inCampus.map(e=>e.id);
  let directorReviewsByEval={};
  if(evalIds.length>0){
    const{data:dirs}=await sb.from('evaluation_director_reviews')
      .select('*')
      .in('evaluation_id',evalIds);
    (dirs||[]).forEach(r=>{directorReviewsByEval[r.evaluation_id]=r;});
  }

  /* Categorise */
  FACULTY_LIST=inCampus.map(ev=>{
    const dirReview=directorReviewsByEval[ev.id];
    let seg;
    const ws=ev.workflow_status;
    if(ws==='returned_to_dean')seg='returned';
    else if(ws==='director_verified'||ws==='complete')seg='verified';
    else seg='pending'; /* all_deans_complete, with_director */
    return{...ev,my_director_review:dirReview,seg};
  });

  const counts={pending:0,returned:0,verified:0};
  FACULTY_LIST.forEach(f=>{counts[f.seg]++;});
  document.getElementById('ct-pending').textContent=counts.pending;
  document.getElementById('ct-returned').textContent=counts.returned;
  document.getElementById('ct-verified').textContent=counts.verified;

  renderList();
}

function switchSeg(seg){
  SEG=seg;
  document.querySelectorAll('.seg-tab').forEach(b=>b.classList.toggle('active',b.dataset.seg===seg));
  renderList();
}

function renderList(){
  const list=document.getElementById('fac-list');
  const filtered=FACULTY_LIST.filter(f=>f.seg===SEG);
  list.innerHTML='';
  if(filtered.length===0){
    const empty=document.createElement('div');
    empty.className='fac-empty';
    let msg='Nothing here yet';
    if(SEG==='pending')msg='No evaluations awaiting your verification.';
    else if(SEG==='returned')msg='No evaluations have been returned to dean.';
    else if(SEG==='verified')msg='No evaluations verified yet for this cycle.';
    empty.innerHTML=`<div class="fac-empty-icon">◇</div><span class="fac-empty-strong">${escapeHtml(msg)}</span><div>Evaluations appear here once all three deans have completed their reviews.</div>`;
    list.appendChild(empty);
    return;
  }
  filtered.forEach(f=>{
    const fm=f.faculty_master||{};
    const row=document.createElement('div');
    row.className='fac-row';
    row.onclick=()=>openDetail(f);

    const pubCount=f.publications_count||0;
    const epCount=f.ep_count||0;
    const instCount=Array.isArray(f.institution_entries)?f.institution_entries.length:0;
    const srCount=Array.isArray(f.sponsored_research_entries)?f.sponsored_research_entries.length:0;

    let pillCls='pill-pending',pillTxt='Awaiting verification';
    if(f.workflow_status==='returned_to_dean'){pillCls='pill-returned';pillTxt='Returned to dean';}
    else if(f.workflow_status==='director_verified'){pillCls='pill-verified';pillTxt='Verified · awaiting Dean Academics';}
    else if(f.workflow_status==='complete'){pillCls='pill-complete';pillTxt='Complete';}
    else if(f.workflow_status==='with_director'){pillCls='pill-pending';pillTxt='In your review';}

    const lastActionAt=f.my_director_review?.acted_at||f.updated_at;
    const lastActionLabel=f.my_director_review?.acted_at?'Last acted':'Submitted';

    row.innerHTML=`
      <div class="fac-row-l">
        <div class="fac-row-name">${escapeHtml(fm.name||'(unknown)')}</div>
        <div class="fac-row-meta">
          <span class="fac-row-meta-item">${escapeHtml(fm.designation||'')}</span>
          <span class="fac-row-meta-sep">·</span>
          <span class="fac-row-meta-item">${escapeHtml(fm.campus||'')}</span>
          ${fm.subject_area?`<span class="fac-row-meta-sep">·</span><span class="fac-row-meta-item">${escapeHtml(fm.subject_area)}</span>`:''}
        </div>
        <div class="fac-row-counts">
          <span class="fac-row-count"><span class="fac-row-count-n">${pubCount}</span> publications</span>
          <span class="fac-row-count"><span class="fac-row-count-n">${epCount}</span> EP</span>
          <span class="fac-row-count"><span class="fac-row-count-n">${srCount}</span> sponsored</span>
          <span class="fac-row-count"><span class="fac-row-count-n">${instCount}</span> institution</span>
        </div>
      </div>
      <div class="fac-row-r">
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          <span class="pill ${pillCls}"><span class="pill-dot"></span>${escapeHtml(pillTxt)}</span>
          <div class="fac-row-time">
            <span class="fac-row-time-l">${escapeHtml(lastActionLabel)}</span>
            ${formatDate(lastActionAt)}
          </div>
        </div>
        <div class="fac-row-chev">›</div>
      </div>
    `;
    list.appendChild(row);
  });
}

/* ---------- Detail view ---------- */
async function openDetail(f){
  CURRENT_EVAL=f;
  CURRENT_FAC=f.faculty_master||{};

  const[pubs,eps,deanReviews,dirReview,assessment]=await Promise.all([
    sb.from('faculty_publications').select('*').eq('faculty_master_id',CURRENT_FAC.id).eq('academic_year',ACADEMIC_YEAR).order('year',{ascending:false}),
    sb.from('ep_programmes').select('*').eq('faculty_master_id',CURRENT_FAC.id).eq('academic_year',ACADEMIC_YEAR).order('date_conducted',{ascending:false}),
    sb.from('evaluation_dean_reviews').select('*').eq('evaluation_id',f.id),
    sb.from('evaluation_director_reviews').select('*').eq('evaluation_id',f.id).maybeSingle(),
    sb.from('director_performance_assessments').select('*').eq('faculty_master_id',CURRENT_FAC.id).eq('academic_year',ACADEMIC_YEAR).maybeSingle()
  ]);
  const publications=pubs.data||[];
  const programmes=eps.data||[];
  DEAN_REVIEWS=(deanReviews.data||[]).filter(r=>r.validated===true);
  MY_DIRECTOR_REVIEW=dirReview.data||null;
  CURRENT_ASSESSMENT=assessment.data||null;

  document.getElementById('d-name').textContent=CURRENT_FAC.name||'(unknown)';
  document.getElementById('d-meta').textContent=`${CURRENT_FAC.designation||''} · ${CURRENT_FAC.campus||''} · Submitted ${formatDate(f.gate1_submitted_at||f.updated_at)}`;

  renderDetailContent(f,publications,programmes);
  renderPanel(f);

  /* Optionally set workflow to with_director on first open if it's still all_deans_complete */
  if(f.workflow_status==='all_deans_complete'){
    try{
      await sb.from('faculty_evaluations').update({workflow_status:'with_director',updated_at:new Date().toISOString()}).eq('id',f.id);
      f.workflow_status='with_director';
      CURRENT_EVAL.workflow_status='with_director';
    }catch(e){dlog('mark with_director',e);}
  }

  document.getElementById('detail').classList.add('open');
  window.scrollTo(0,0);
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  CURRENT_EVAL=null;CURRENT_FAC=null;DEAN_REVIEWS=[];MY_DIRECTOR_REVIEW=null;CURRENT_ASSESSMENT=null;
  loadFacultyList();
}

function renderDetailContent(f,publications,programmes){
  const c=document.getElementById('d-content');
  c.innerHTML='';

  /* Dean Reviews Summary - prominent at top */
  c.appendChild(buildDeansSummary(f));

  /* Director Performance Assessment - judgment layer, immediately after the dean signals */
  c.appendChild(buildAssessmentBlock(f));

  /* Faculty submission sections */
  c.appendChild(buildProfileSection(f));
  c.appendChild(buildTeachingSection(f));
  c.appendChild(buildResearchSection(f,publications));
  c.appendChild(buildSponsoredSection(f));
  c.appendChild(buildEpSection(f,programmes));
  c.appendChild(buildInstitutionSection(f));
}

function buildDeansSummary(f){
  const block=document.createElement('div');
  block.className='deans-block';

  const h=document.createElement('div');h.className='deans-h';
  const wrap=document.createElement('div');
  const ht=document.createElement('div');ht.className='deans-h-t';ht.textContent='Dean Reviews Summary';
  const hs=document.createElement('div');hs.className='deans-h-s';
  hs.textContent='Three dean perspectives on this evaluation. Your role is to validate institutional consistency across them, not to relitigate each call.';
  wrap.appendChild(ht);wrap.appendChild(hs);
  h.appendChild(wrap);
  block.appendChild(h);

  const grid=document.createElement('div');grid.className='deans-grid';
  ['academics','research','ep'].forEach(role=>{
    const r=DEAN_REVIEWS.find(x=>x.dean_role===role);
    const card=document.createElement('div');
    card.className='dean-card '+(r?'complete':'pending-c');

    const head=document.createElement('div');head.className='dean-card-head';
    const left=document.createElement('div');
    const roleLbl=document.createElement('div');roleLbl.className='dean-card-role';roleLbl.textContent=DEAN_LABELS[role]||role;
    const name=document.createElement('div');name.className='dean-card-name';name.textContent=r?(r.dean_name||r.dean_email||'—'):'Not yet reviewed';
    left.appendChild(roleLbl);left.appendChild(name);
    const status=document.createElement('div');status.className='dean-card-status '+(r?'ok':'wait');
    status.textContent=r?'Reviewed':'Pending';
    head.appendChild(left);head.appendChild(status);
    card.appendChild(head);

    const notes=document.createElement('div');notes.className='dean-card-notes'+(r&&r.notes?'':' empty');
    notes.textContent=r&&r.notes?r.notes:'(no notes recorded)';
    card.appendChild(notes);

    const foot=document.createElement('div');foot.className='dean-card-foot';
    foot.textContent=r&&r.validated_at?formatDateTime(r.validated_at):'';
    card.appendChild(foot);

    grid.appendChild(card);
  });
  block.appendChild(grid);

  /* Revenue verification strip */
  const epReview=DEAN_REVIEWS.find(x=>x.dean_role==='ep');
  const strip=document.createElement('div');
  if(!epReview){
    strip.className='rev-strip na';
    strip.innerHTML='<span class="rev-strip-icon">◇</span><span class="rev-strip-text">Revenue verification: <strong>not yet checked</strong> by Dean EP.</span>';
  }else if(epReview.revenue_verified===true){
    strip.className='rev-strip ok';
    strip.innerHTML='<span class="rev-strip-icon">✓</span><span class="rev-strip-text">Revenue verification: <strong>verified</strong> by Dean EP with Finance.</span>';
  }else if(epReview.revenue_verified===false){
    strip.className='rev-strip flag';
    strip.innerHTML='<span class="rev-strip-icon">!</span><span class="rev-strip-text">Revenue verification: <strong>discrepancy flagged</strong> by Dean EP. Consider returning to dean for reconciliation.</span>';
  }else{
    strip.className='rev-strip na';
    strip.innerHTML='<span class="rev-strip-icon">◇</span><span class="rev-strip-text">Revenue verification: <strong>not recorded</strong>.</span>';
  }
  block.appendChild(strip);

  return block;
}

/* ---------- Director Performance Assessment ---------- */
const ASSESS_AREAS=[['teaching','Teaching'],['research','Research'],['institution','Institution building'],['external','External programs']];
const ASSESS_DIMS=[['effort','Effort'],['performance','Performance'],['potential','Potential']];
const ASSESS_VALS=[['L','L'],['M','M'],['H','H'],['NA','–']];

function buildAssessmentBlock(f){
  const block=document.createElement('div');block.className='assess-block';

  const h=document.createElement('div');h.className='assess-h';
  const n=document.createElement('div');n.className='assess-n';n.textContent='★';
  const wrap=document.createElement('div');
  const ht=document.createElement('div');ht.className='assess-h-t';ht.textContent='Director Performance Assessment';
  const hs=document.createElement('div');hs.className='assess-h-s';
  hs.textContent='Your judgment of this faculty member across the four areas. Rate effort, performance, and potential as High, Medium, or Low. Mark an area not applicable if it was not part of their remit this year. Saving here is separate from verification and does not block it.';
  wrap.appendChild(ht);wrap.appendChild(hs);
  h.appendChild(n);h.appendChild(wrap);
  block.appendChild(h);

  const grid=document.createElement('div');grid.className='assess-grid';
  grid.appendChild(document.createElement('div'));
  ASSESS_DIMS.forEach(([dk,dl])=>{const c=document.createElement('div');c.className='assess-colh';c.textContent=dl;grid.appendChild(c);});

  const existing=(CURRENT_ASSESSMENT&&CURRENT_ASSESSMENT.ratings)||{};
  ASSESS_AREAS.forEach(([ak,al])=>{
    const areaCell=document.createElement('div');
    const a=document.createElement('div');a.className='assess-area';a.textContent=al;
    areaCell.appendChild(a);
    if(ak==='external'){const na=document.createElement('div');na.className='assess-area-na';na.textContent='mark – if outside their remit';areaCell.appendChild(na);}
    grid.appendChild(areaCell);
    ASSESS_DIMS.forEach(([dk])=>{
      const seg=document.createElement('div');seg.className='assess-seg';
      const cur=(existing[ak]&&existing[ak][dk])||null;
      ASSESS_VALS.forEach(([v,lab])=>{
        const b=document.createElement('div');
        b.className='assess-b'+(v==='NA'?' na':'')+(cur===v?' on':'');
        b.textContent=lab;b.dataset.area=ak;b.dataset.dim=dk;b.dataset.val=v;
        b.onclick=()=>{seg.querySelectorAll('.assess-b').forEach(x=>x.classList.remove('on'));b.classList.add('on');};
        seg.appendChild(b);
      });
      grid.appendChild(seg);
    });
  });
  block.appendChild(grid);

  const ta=document.createElement('textarea');ta.className='assess-comment';ta.id='assess-comment';
  ta.placeholder='One qualitative note the President will see alongside the grid. Optional.';
  ta.value=(CURRENT_ASSESSMENT&&CURRENT_ASSESSMENT.comments&&CURRENT_ASSESSMENT.comments.overall)||'';
  block.appendChild(ta);

  const foot=document.createElement('div');foot.className='assess-foot';
  const save=document.createElement('button');save.className='assess-save';save.id='assess-save-btn';save.textContent='Save assessment';
  save.onclick=saveAssessment;
  const note=document.createElement('div');note.className='assess-note';note.id='assess-note';
  note.textContent=CURRENT_ASSESSMENT?'Last saved assessment loaded. Update and save again any time before the cycle closes.':'Does not block verification. You can verify now and assess later.';
  foot.appendChild(save);foot.appendChild(note);
  block.appendChild(foot);

  return block;
}

async function saveAssessment(){
  if(!CURRENT_EVAL||!CURRENT_FAC){return;}
  const ratings={};
  ASSESS_AREAS.forEach(([ak])=>{
    const obj={};
    ASSESS_DIMS.forEach(([dk])=>{
      const on=document.querySelector('.assess-b.on[data-area="'+ak+'"][data-dim="'+dk+'"]');
      if(on)obj[dk]=on.dataset.val;
    });
    if(Object.keys(obj).length>0)ratings[ak]=obj;
  });
  const commentVal=document.getElementById('assess-comment').value.trim();
  const comments={overall:commentVal||null};
  const payload={
    faculty_master_id:CURRENT_FAC.id,
    academic_year:ACADEMIC_YEAR,
    ratings,
    comments,
    director_email:CURRENT_USER.email
  };
  const btn=document.getElementById('assess-save-btn');
  const orig=btn.textContent;btn.textContent='Saving...';btn.disabled=true;
  try{
    const{error}=await sb.from('director_performance_assessments')
      .upsert(payload,{onConflict:'faculty_master_id,academic_year'});
    if(error)throw error;
    CURRENT_ASSESSMENT=Object.assign({},CURRENT_ASSESSMENT||{},payload);
    const note=document.getElementById('assess-note');if(note)note.textContent='Saved. Update and save again any time before the cycle closes.';
    toast('Assessment saved');
  }catch(e){
    dlog('SAVE ASSESSMENT',e);
    const code=e.code?' ['+e.code+']':'';
    toast('Assessment save failed'+code+': '+(e.message||'unknown')+'. Tell Girish.',false);
  }finally{
    btn.textContent=orig;btn.disabled=false;
  }
}

function makeSection(num,title,subtitle){
  const sec=document.createElement('div');
  sec.className='sec-block';
  const h=document.createElement('div');h.className='sec-h';
  const n=document.createElement('div');n.className='sec-n';n.textContent=num;
  const wrap=document.createElement('div');
  const ht=document.createElement('div');ht.className='sec-h-t';ht.textContent=title;
  const hs=document.createElement('div');hs.className='sec-h-s';hs.textContent=subtitle;
  wrap.appendChild(ht);wrap.appendChild(hs);
  h.appendChild(n);h.appendChild(wrap);
  sec.appendChild(h);
  return sec;
}

function dataRow(label,value){
  const r=document.createElement('div');r.className='data-row';
  const l=document.createElement('div');l.className='data-label';l.textContent=label;
  const v=document.createElement('div');v.className='data-value';
  if(value===null||value===undefined||value===''){v.classList.add('empty');v.textContent='Not provided';}
  else v.textContent=value;
  r.appendChild(l);r.appendChild(v);
  return r;
}

function narrative(label,text){
  if(!text)return null;
  const w=document.createElement('div');w.className='narrative-block';
  const h=document.createElement('div');h.className='narrative-h';h.textContent=label;
  const t=document.createElement('div');t.className='narrative-t';t.textContent=text;
  w.appendChild(h);w.appendChild(t);
  return w;
}

function buildResearchSection(f,publications){
  const sec=makeSection('03','Research & Publications','Publications, indices, and library data sources used');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('H-Index',f.h_index));
  grid.appendChild(dataRow('Google Scholar Citations',f.gscholar_citations));
  grid.appendChild(dataRow('UGC-CARE Listed (legacy)',f.ugc_care_count));
  const ds=Array.isArray(f.data_sources_used)?f.data_sources_used.join(', '):null;
  grid.appendChild(dataRow('Data Sources Used',ds));
  sec.appendChild(grid);
  const wip=narrative('Work in Progress',f.wip_details);
  if(wip)sec.appendChild(wip);
  const ext=narrative('External Resources Needed',f.external_resources_needed);
  if(ext)sec.appendChild(ext);

  if(publications.length>0){
    const h=document.createElement('div');h.className='narrative-h';h.style.marginTop='18px';h.textContent='Publications ('+publications.length+')';
    sec.appendChild(h);
    const list=document.createElement('div');list.className='entry-list';
    publications.forEach(p=>{
      const card=document.createElement('div');card.className='entry-card';
      const hdr=document.createElement('div');hdr.className='entry-card-h';
      const t=document.createElement('div');t.className='entry-card-t';
      t.textContent=(p.publication_type==='conference'?'[Presentation] ':'')+(p.title||'(no title)');
      hdr.appendChild(t);
      const tag=document.createElement('div');tag.className='entry-card-tag';
      tag.textContent=(p.publication_type||'').replace(/_/g,' ').toUpperCase();
      hdr.appendChild(tag);
      if(p.abdc_category==='A*'||p.sjr_quartile==='Q1'){
        const tier=document.createElement('div');tier.className='entry-card-tag tier';
        tier.textContent=p.abdc_category==='A*'?'ABDC A*':'Q1';
        hdr.appendChild(tier);
      }
      card.appendChild(hdr);
      const metaParts=[];
      if(p.year)metaParts.push(p.year);
      if(p.journal_name)metaParts.push(p.journal_name);
      else if(p.book_publisher)metaParts.push(p.book_publisher);
      else if(p.case_publisher)metaParts.push(p.case_publisher);
      else if(p.conference_name)metaParts.push(p.conference_name);
      else if(p.chapter_publisher)metaParts.push(p.chapter_publisher);
      if(p.abdc_category)metaParts.push('ABDC '+p.abdc_category);
      if(p.sjr_quartile)metaParts.push('SJR '+p.sjr_quartile);
      if(p.author_position)metaParts.push((p.author_position||'').replace(/_/g,' '));
      if(p.coauthors)metaParts.push('with '+p.coauthors);
      if(metaParts.length>0){
        const meta=document.createElement('div');meta.className='entry-card-meta';
        meta.textContent=metaParts.join(' · ');
        card.appendChild(meta);
      }
      list.appendChild(card);
    });
    sec.appendChild(list);
  }
  return sec;
}

/* ---------- Panel ---------- */
function renderPanel(f){
  const p=document.getElementById('d-panel');
  p.innerHTML='';

  const h=document.createElement('div');h.className='panel-h';h.textContent="Director's Validation";
  p.appendChild(h);

  const role=document.createElement('div');role.className='panel-role';
  role.innerHTML=`<span class="panel-role-dot"></span>Director · ${escapeHtml(MY_CAMPUS)}`;
  p.appendChild(role);

  const s=document.createElement('div');s.className='panel-s';
  s.textContent='Confirm the package is institutionally sound. Verify with optional comments to pass to Dean Academics, or return with comments if the dean reviews need reconciliation.';
  p.appendChild(s);

  /* Banner based on current state */
  const ws=f.workflow_status;
  const lastAction=MY_DIRECTOR_REVIEW?.action;
  if(ws==='director_verified'){
    const b=document.createElement('div');b.className='panel-banner verified';
    b.innerHTML=`<strong>Verified.</strong>Sent to Dean Academics for management synthesis. ${MY_DIRECTOR_REVIEW?.acted_at?'Acted '+formatDateTime(MY_DIRECTOR_REVIEW.acted_at)+'.':''}`;
    p.appendChild(b);
  }else if(ws==='complete'){
    const b=document.createElement('div');b.className='panel-banner complete';
    b.innerHTML=`<strong>Complete.</strong>Dean Academics has released this evaluation to the faculty member.`;
    p.appendChild(b);
  }else if(ws==='returned_to_dean'){
    const b=document.createElement('div');b.className='panel-banner returned';
    b.innerHTML=`<strong>Returned to Dean Academics.</strong>Awaiting re-review. ${MY_DIRECTOR_REVIEW?.acted_at?'Returned '+formatDateTime(MY_DIRECTOR_REVIEW.acted_at)+'.':''}`;
    p.appendChild(b);
  }

  /* Comments textarea */
  const cf=document.createElement('div');cf.className='panel-field';
  const cl=document.createElement('div');cl.className='panel-field-l';
  cl.innerHTML=`<span>Your comments</span><span class="panel-field-l-r">required on return · optional on verify</span>`;
  const ta=document.createElement('textarea');ta.className='panel-textarea';ta.id='dir-comments';
  ta.placeholder='Note any observations about institutional consistency, the dean signals, or specific concerns to address.';
  ta.value=MY_DIRECTOR_REVIEW?.action_comments||'';
  cf.appendChild(cl);cf.appendChild(ta);
  p.appendChild(cf);

  /* Action buttons */
  const actions=document.createElement('div');actions.className='panel-actions';
  const verifyBtn=document.createElement('button');
  verifyBtn.className='pa-btn verify';
  verifyBtn.id='btn-verify';
  verifyBtn.innerHTML=`Verify<span class="pa-btn-sub">Pass to Dean Academics</span>`;
  verifyBtn.onclick=()=>submitAction('verify');
  const returnBtn=document.createElement('button');
  returnBtn.className='pa-btn return';
  returnBtn.id='btn-return';
  returnBtn.innerHTML=`Return<span class="pa-btn-sub">Send back to dean for re-review</span>`;
  returnBtn.onclick=()=>submitAction('return');
  actions.appendChild(verifyBtn);
  actions.appendChild(returnBtn);
  p.appendChild(actions);

  /* Action history */
  const hist=MY_DIRECTOR_REVIEW?.action_history||[];
  if(Array.isArray(hist)&&hist.length>0){
    const hb=document.createElement('div');hb.className='panel-hist';
    const hh=document.createElement('div');hh.className='panel-hist-h';hh.textContent='Action history';
    hb.appendChild(hh);
    /* Most recent first */
    [...hist].reverse().forEach(e=>{
      const ent=document.createElement('div');ent.className='hist-entry';
      const top=document.createElement('div');
      const a=document.createElement('span');a.className='hist-action '+(e.action||'');
      a.textContent=(e.action||'').toUpperCase();
      top.appendChild(a);
      const who=document.createElement('span');who.textContent=e.director_name||e.director_email||'';
      top.appendChild(who);
      ent.appendChild(top);
      if(e.acted_at){
        const m=document.createElement('div');m.className='hist-meta';m.textContent=formatDateTime(e.acted_at);
        ent.appendChild(m);
      }
      if(e.comments){
        const n=document.createElement('div');n.className='hist-notes';n.textContent=e.comments;
        ent.appendChild(n);
      }
      hb.appendChild(ent);
    });
    p.appendChild(hb);
  }
}

async function submitAction(action){
  if(!CURRENT_EVAL){return;}
  if(!['verify','return'].includes(action)){return;}

  const comments=document.getElementById('dir-comments').value.trim();
  if(action==='return'&&!comments){
    toast('Comments are required when returning to Dean Academics. Tell her what needs to be reconciled.',false);
    return;
  }

  /* Check all 3 dean reviews are present (defensive) */
  if(DEAN_REVIEWS.filter(r=>r.validated).length<3){
    toast('All three dean reviews must be complete before director action.',false);
    return;
  }

  const verifyBtn=document.getElementById('btn-verify');
  const returnBtn=document.getElementById('btn-return');
  verifyBtn.disabled=true;returnBtn.disabled=true;
  const activeBtn=action==='verify'?verifyBtn:returnBtn;
  const origLabel=activeBtn.innerHTML;
  activeBtn.innerHTML='Submitting...';

  try{
    const now=new Date().toISOString();
    const histEntry={
      action,
      comments:comments||null,
      acted_at:now,
      director_email:CURRENT_USER.email,
      director_name:MY_DIRECTOR_NAME
    };
    const prevHist=Array.isArray(MY_DIRECTOR_REVIEW?.action_history)?MY_DIRECTOR_REVIEW.action_history:[];
    const newHist=[...prevHist,histEntry];

    const payload={
      evaluation_id:CURRENT_EVAL.id,
      director_email:CURRENT_USER.email,
      director_name:MY_DIRECTOR_NAME,
      campus:MY_CAMPUS,
      action,
      action_comments:comments||null,
      acted_at:now,
      action_history:newHist
    };

    const{error}=await sb.from('evaluation_director_reviews')
      .upsert(payload,{onConflict:'evaluation_id'});
    if(error)throw error;

    /* Advance workflow_status */
    const newStatus=action==='verify'?'director_verified':'returned_to_dean';
    const{error:wsErr}=await sb.from('faculty_evaluations')
      .update({workflow_status:newStatus,updated_at:now})
      .eq('id',CURRENT_EVAL.id);
    if(wsErr)throw wsErr;

    CURRENT_EVAL.workflow_status=newStatus;
    MY_DIRECTOR_REVIEW={...payload};

    toast(action==='verify'?'Verified. Sent to Dean Academics.':'Returned to Dean Academics.');

    /* Re-render panel and update list state */
    renderPanel(CURRENT_EVAL);
  }catch(e){
    dlog('SUBMIT DIR ACTION',e);
    const code=e.code?` [${e.code}]`:'';
    toast('Submit failed'+code+': '+(e.message||'unknown')+'. Tell Girish.',false);
    activeBtn.innerHTML=origLabel;
    verifyBtn.disabled=false;returnBtn.disabled=false;
  }
}
