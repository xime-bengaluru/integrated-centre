<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Hub · Dean Review</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="assets/js/supabase-js-2.105.4.umd.js"></script>
<style>
  :root{
    --navy:#0D1F35;--navy-mid:#1A3352;--navy-l:#243D5C;--navy-dark:#0a1a2e;
    --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#A88A2B;--gold-pale:#F7EDD0;
    --cream:#FAF8F4;--parchment:#FBFAF6;--white:#FFFFFF;
    --text:#0D1F35;--sub:#4A5D72;--muted:#5A6B82;--faint:#7a8699;
    --line:#E5DFD2;--line-strong:#D8D2C5;--border:#D8D2C5;
    --red:#C8102E;--teal:#0D9268;--teal-l:#6FCDA8;--amber:#D97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}

  /* Top bar */
  .topbar{background:var(--navy);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(201,168,76,.25)}
  .tb-l{display:flex;align-items:center;gap:14px}
  .tb-logo{height:26px;width:auto}
  .tb-div{width:1px;height:22px;background:rgba(255,255,255,.15)}
  .tb-title{font-size:13px;font-weight:500;color:rgba(255,255,255,.75);letter-spacing:.04em}
  .tb-r{display:flex;align-items:center;gap:12px}
  .tb-back{font-size:12px;color:rgba(255,255,255,.6);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
  .tb-back:hover{background:rgba(255,255,255,.05);color:white}
  .tb-signout{font-size:12px;color:rgba(255,255,255,.6);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
  .tb-signout:hover{background:rgba(255,255,255,.05);color:white}

  /* Hero strip */
  .hero{background:var(--navy);padding:32px 32px 36px;border-bottom:2px solid var(--gold)}
  .hero-l{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .hero-t{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;color:white;line-height:1.15;margin-bottom:6px}
  .hero-t em{color:var(--gold-l);font-style:italic}
  .hero-s{font-size:13px;color:rgba(255,255,255,.55);max-width:680px;line-height:1.55}
  .hero-tag{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);border-radius:18px;font-size:11px;color:var(--gold-l);font-weight:500;letter-spacing:.04em;margin-top:14px}
  .hero-tag-dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  /* Container */
  .main{max-width:1180px;margin:0 auto;padding:28px 24px 60px}

  /* Tabs (segmented list switcher) */
  .seg-tabs{display:flex;gap:0;background:white;border:1px solid var(--line-strong);border-radius:10px;padding:4px;width:fit-content;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .seg-tab{padding:9px 18px;font-size:13px;font-weight:500;color:var(--sub);background:transparent;border:none;border-radius:7px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;transition:all .15s}
  .seg-tab.active{background:var(--navy);color:white}
  .seg-tab:not(.active):hover{background:var(--cream)}
  .seg-tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;padding:0 6px;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;border-radius:9px;background:rgba(201,168,76,.18);color:var(--gold-d)}
  .seg-tab.active .seg-tab-count{background:rgba(255,255,255,.18);color:white}

  /* Faculty list */
  .fac-list{display:flex;flex-direction:column;gap:10px}
  .fac-empty{padding:48px 32px;background:white;border:1px dashed var(--line-strong);border-radius:12px;text-align:center;color:var(--muted);font-size:13px}
  .fac-empty-icon{font-size:32px;color:var(--faint);margin-bottom:10px;line-height:1}
  .fac-empty-strong{display:block;color:var(--sub);font-weight:500;margin-bottom:4px;font-size:14px}

  .fac-row{background:white;border:1px solid var(--line);border-radius:11px;padding:18px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
  .fac-row:hover{border-color:var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.06);transform:translateY(-1px)}
  .fac-row-l{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fac-row-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--text);line-height:1.15}
  .fac-row-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fac-row-meta-item{display:inline-flex;align-items:center;gap:5px}
  .fac-row-meta-sep{color:var(--line-strong)}
  .fac-row-counts{display:flex;gap:14px;margin-top:4px;font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;letter-spacing:.02em}
  .fac-row-count{display:inline-flex;align-items:center;gap:5px}
  .fac-row-count-n{color:var(--navy);font-weight:600}
  .fac-row-r{display:flex;align-items:center;gap:14px}
  .fac-row-time{font-size:11px;color:var(--faint);font-family:'DM Mono',monospace;text-align:right;line-height:1.4}
  .fac-row-time-l{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:9px;color:var(--faint);margin-bottom:2px}
  .fac-row-chev{font-size:18px;color:var(--gold);line-height:1}

  /* Status pill */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;font-family:'DM Mono',monospace;padding:3px 10px;border-radius:11px;letter-spacing:.03em}
  .pill-dot{width:5px;height:5px;border-radius:50%}
  .pill-pending{background:rgba(217,119,6,.1);color:var(--amber);border:.5px solid rgba(217,119,6,.25)}
  .pill-pending .pill-dot{background:var(--amber)}
  .pill-reviewed{background:rgba(13,146,104,.1);color:var(--teal);border:.5px solid rgba(13,146,104,.3)}
  .pill-reviewed .pill-dot{background:var(--teal)}
  .pill-finalized{background:rgba(13,31,53,.08);color:var(--navy);border:.5px solid rgba(13,31,53,.18)}
  .pill-finalized .pill-dot{background:var(--navy)}
  .pill-returned{background:rgba(200,16,46,.08);color:var(--red);border:.5px solid rgba(200,16,46,.25)}
  .pill-returned .pill-dot{background:var(--red)}
  .pill-verified{background:rgba(201,168,76,.12);color:var(--gold-d);border:.5px solid rgba(201,168,76,.4)}
  .pill-verified .pill-dot{background:var(--gold)}

  /* Director comment surfacing block (re-review mode + finalize mode) */
  .dir-block{margin-bottom:28px;border-radius:12px;padding:20px 22px;border:1px solid}
  .dir-block.return{background:rgba(200,16,46,.04);border-color:rgba(200,16,46,.3)}
  .dir-block.verify{background:rgba(13,146,104,.04);border-color:rgba(13,146,104,.3)}
  .dir-block-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
  .dir-block.return .dir-block-eyebrow{color:var(--red)}
  .dir-block.verify .dir-block-eyebrow{color:var(--teal)}
  .dir-block-h{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500;color:var(--text);margin-bottom:10px;line-height:1.2}
  .dir-block-comments{font-size:13px;color:var(--text);line-height:1.6;background:white;padding:12px 14px;border-radius:7px;border:.5px solid var(--line);white-space:pre-wrap}
  .dir-block-comments.empty{color:var(--faint);font-style:italic}
  .dir-block-foot{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:8px}

  /* Detail drawer (full page when active) */
  .detail{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--cream);z-index:200;overflow-y:auto}
  .detail.open{display:block}
  .detail-bar{background:var(--navy);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(201,168,76,.25)}
  .detail-bar-l{display:flex;align-items:center;gap:14px;color:white}
  .detail-back{font-size:13px;color:rgba(255,255,255,.7);background:transparent;border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .detail-back:hover{background:rgba(255,255,255,.05);color:white}
  .detail-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:500;color:white}
  .detail-meta{font-size:11px;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace}

  .detail-layout{display:grid;grid-template-columns:1fr 380px;gap:0;min-height:calc(100vh - 62px)}
  .detail-content{padding:32px 36px;border-right:1px solid var(--line);overflow-y:auto}
  .detail-panel{background:white;padding:28px 26px;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;border-left:1px solid var(--line)}

  /* Content rendering (read-only mirror of evaluation.html sections) */
  .sec-block{margin-bottom:32px;background:white;border:1px solid var(--line);border-radius:12px;padding:24px 26px}
  .sec-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .sec-n{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold-d);line-height:1;font-weight:500;min-width:34px}
  .sec-h-t{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;color:var(--text);line-height:1.15;margin-bottom:3px}
  .sec-h-s{font-size:12px;color:var(--muted);line-height:1.45}

  .data-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-bottom:14px}
  .data-row{display:flex;flex-direction:column;gap:3px;padding:8px 0}
  .data-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .data-value{font-size:13.5px;color:var(--text);line-height:1.5;word-wrap:break-word;min-height:18px}
  .data-value.empty{color:var(--faint);font-style:italic;font-size:12.5px}

  .narrative-block{margin-top:14px}
  .narrative-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .narrative-t{font-size:13.5px;color:var(--text);line-height:1.6;white-space:pre-wrap;background:var(--cream);padding:12px 14px;border-radius:7px;border:.5px solid var(--line)}

  /* Entry list (publications, EP, institution, sponsored research) */
  .entry-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .entry-card{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
  .entry-card-h{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .entry-card-t{font-size:13.5px;font-weight:500;color:var(--text);line-height:1.4;flex:1;min-width:0}
  .entry-card-tag{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:9px;background:rgba(13,31,53,.08);color:var(--navy);font-family:'DM Mono',monospace}
  .entry-card-tag.tier{background:rgba(201,168,76,.16);color:var(--gold-d);border:.5px solid rgba(201,168,76,.4)}
  .entry-card-meta{font-size:11.5px;color:var(--muted);line-height:1.5}
  .entry-card-desc{font-size:12.5px;color:var(--sub);line-height:1.55;font-style:italic;margin-top:5px}

  /* Comments panel (docked) */
  .panel-h{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.2}
  .panel-s{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:18px}
  .panel-role{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.35);border-radius:14px;font-size:10.5px;color:var(--gold-d);font-family:'DM Mono',monospace;letter-spacing:.06em;font-weight:600;margin-bottom:18px}
  .panel-role-dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}

  .panel-field{margin-bottom:18px}
  .panel-field-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
  .panel-field-l-r{font-size:10px;color:var(--faint);font-weight:500;text-transform:none;letter-spacing:.02em}
  .panel-textarea{width:100%;min-height:140px;padding:11px 13px;border:1px solid var(--line-strong);border-radius:7px;font-family:inherit;font-size:13px;color:var(--text);resize:vertical;line-height:1.55;background:var(--parchment)}
  .panel-textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12)}

  /* EP-specific revenue field */
  .panel-ep-revenue{margin-bottom:18px;padding:14px 16px;background:rgba(201,168,76,.06);border:1px dashed rgba(201,168,76,.4);border-radius:8px}
  .panel-ep-revenue-h{font-size:11.5px;font-weight:600;color:var(--gold-d);margin-bottom:6px;letter-spacing:.04em}
  .panel-ep-revenue-s{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:8px}
  .panel-ep-revenue-toggle{display:flex;gap:8px}
  .ep-rev-btn{flex:1;padding:8px 12px;background:white;border:1px solid var(--line-strong);border-radius:6px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;font-weight:500}
  .ep-rev-btn.active.yes{background:rgba(13,146,104,.12);color:var(--teal);border-color:var(--teal)}
  .ep-rev-btn.active.no{background:rgba(200,16,46,.08);color:var(--red);border-color:var(--red)}

  /* Submit button */
  .panel-submit{width:100%;padding:13px 18px;background:var(--gold);color:var(--navy);border:none;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:10px}
  .panel-submit:hover{background:var(--gold-l)}
  .panel-submit:disabled{background:var(--line-strong);color:var(--faint);cursor:not-allowed}
  .panel-submit-saved{margin-top:10px;text-align:center;font-size:11px;color:var(--teal);font-family:'DM Mono',monospace;display:none}
  .panel-submit-saved.show{display:block}

  /* Already-reviewed banner */
  .panel-completed{background:rgba(13,146,104,.08);border-left:3px solid var(--teal);padding:12px 14px;border-radius:6px;margin-bottom:14px;font-size:12px;color:var(--teal-l);line-height:1.5}
  .panel-completed strong{color:var(--teal);font-weight:600;display:block;margin-bottom:3px}

  /* Paused-box shade (INTERIM: management synthesis moves to the panel review session).
     Non-destructive. Lays an elegant translucent shade over the synthesis box and
     disables the release action. Reversible: restore renderFinalizePanel from version
     control once the panel review surface ships. */
  .panel-note{font-size:11.5px;color:var(--muted);line-height:1.5;background:rgba(201,168,76,.07);border:1px dashed rgba(201,168,76,.35);border-radius:8px;padding:11px 13px;margin-bottom:14px}
  .paused-wrap{position:relative}
  .paused-wrap .panel-textarea{opacity:.5;background:var(--cream);color:var(--muted);cursor:not-allowed;resize:none}
  .paused-shade{position:absolute;inset:0;border-radius:7px;background:linear-gradient(180deg,rgba(13,31,53,.30),rgba(13,31,53,.42));-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
  .paused-note{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:var(--gold-l);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;padding:8px 15px;border-radius:20px;border:1px solid rgba(201,168,76,.5);box-shadow:0 6px 18px rgba(13,31,53,.32)}
  .paused-note-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:white;padding:12px 22px;border-radius:8px;border-left:3px solid var(--gold);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:300;max-width:480px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);pointer-events:auto;cursor:pointer}

  /* Blocker */
  .blocker{display:none;padding:80px 32px;text-align:center;color:var(--muted);font-size:14px;max-width:520px;margin:0 auto}
  .blocker-h{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--text);margin-bottom:12px;font-weight:500}

  /* Mobile */
  @media (max-width:900px){
    .detail-layout{grid-template-columns:1fr}
    .detail-panel{position:relative;top:0;height:auto;border-left:none;border-top:2px solid var(--gold);max-height:none}
    .data-grid{grid-template-columns:1fr}
    .hero{padding:24px 18px}
    .main{padding:20px 16px 40px}
    .detail-content{padding:24px 18px}
  }

  /* Entry adjudication (a dean flags an entry invalid; reversible, panel-visible, non-destructive) */
  .entry-card.flagged{opacity:.6;border-style:dashed;border-color:rgba(200,16,46,.55)}
  .entry-card.flagged .entry-card-t{text-decoration:line-through;text-decoration-color:rgba(200,16,46,.6)}
  .flag-reason{font-size:11.5px;color:var(--red);line-height:1.5;margin-top:6px;font-style:italic}
  .flag-reason b{font-style:normal;font-weight:600}
  .entry-flag-btn{background:transparent;border:.5px solid var(--line-strong);color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.03em;padding:3px 9px;border-radius:6px;cursor:pointer;transition:all .12s}
  .entry-flag-btn:hover{border-color:var(--red);color:var(--red)}
  .entry-flag-btn.on{border-color:var(--red);color:var(--red);background:rgba(200,16,46,.06)}
  .flag-collapsed{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(200,16,46,.04);border:.5px dashed rgba(200,16,46,.35);border-radius:8px;padding:9px 13px;margin-bottom:8px;font-size:12px;color:var(--red)}
  .flag-collapsed-toggle{background:transparent;border:none;color:var(--red);font-family:'DM Mono',monospace;font-size:10.5px;font-weight:600;cursor:pointer;letter-spacing:.03em;text-decoration:underline}
  .flag-dialog-backdrop{position:fixed;inset:0;background:rgba(13,31,53,.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .flag-dialog{background:var(--parchment);border:1px solid rgba(200,16,46,.3);border-radius:12px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .flag-dialog-h{background:var(--navy);color:#fff;padding:16px 20px;font-family:'Cormorant Garamond',serif;font-size:19px}
  .flag-dialog-b{padding:18px 20px}
  .flag-dialog-b p{font-size:12.5px;color:var(--sub);line-height:1.55;margin-bottom:12px}
  .flag-dialog-b textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:7px;font-family:inherit;font-size:13px;resize:vertical;background:#fff}
  .flag-dialog-f{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 18px}
  .flag-dialog-btn{padding:9px 16px;border-radius:7px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line-strong);background:#fff;color:var(--sub)}
  .flag-dialog-btn.danger{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="tb-l">
    <img src="assets/logo/XIME_LOGO_WHITE.svg" alt="XIME" class="tb-logo">
    <div class="tb-div"></div>
    <div class="tb-title">X-Hub · Dean Review</div>
  </div>
  <div class="tb-r">
    <button class="tb-back" onclick="window.location.href='index.html'">← Home</button>
    <button class="tb-signout" onclick="signOut()">Sign out</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-l" id="hero-l">Dean Review · AY 2025-26</div>
  <div class="hero-t" id="hero-t">Loading...</div>
  <div class="hero-s" id="hero-s">Performance evaluations submitted by faculty for your review.</div>
  <div class="hero-tag"><div class="hero-tag-dot"></div>AY 2025-26 · Cycle Open</div>
</div>

<!-- MAIN LIST VIEW -->

function formatDate(s){
  if(!s)return '—';
  try{return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
  catch(e){return s;}
}

function timeAgo(s){
  if(!s)return '';
  try{
    const d=new Date(s);
    const diff=Math.floor((Date.now()-d.getTime())/1000);
    if(diff<60)return 'just now';
    if(diff<3600)return Math.floor(diff/60)+'m ago';
    if(diff<86400)return Math.floor(diff/3600)+'h ago';
    return Math.floor(diff/86400)+'d ago';
  }catch(e){return '';}
}

/* ---------- Access resolution ---------- */
async function resolveAccess(){
  document.getElementById('blocker').style.display='block';
  document.getElementById('blocker-msg').textContent='Verifying access';

  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return null;}

  /* H8 password gate.
     Source of truth is user_profiles.must_change_password, NOT user_metadata.
     Supabase metadata is set at user creation and does NOT auto-clear when
     password is changed. Removing the metadata pre-check fixes a flicker loop
     observed 30 May 2026 when faculty who had just changed their password got
     bounced back to login because metadata still said true. */
  const{data:profile}=await sb.from('user_profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile){
    document.getElementById('blocker-msg').textContent='Profile not found. Contact admin.';
    return null;
  }
  if(profile.must_change_password===true){
    window.location.href='login.html?action=change-password';
    return null;
  }

  CURRENT_USER=profile;

  /* Check dean registry for this user's email. Allows dean OR director OR super_admin */
  const{data:deanRows}=await sb.from('dean_registry').select('*').eq('email',profile.email);
  const isSuper=profile.role==='super_admin';

  if(!deanRows||deanRows.length===0){
    if(!isSuper){
      document.getElementById('blocker').querySelector('.blocker-h').textContent='Access denied';
      document.getElementById('blocker-msg').textContent='You are not listed as a dean for AY 2025-26. If this is incorrect, contact Girish.';
      return null;
    }
    /* super_admin with no dean assignment - default to Bengaluru academics for preview */
    MY_CAMPUS='Bengaluru';
    MY_DEAN_ROLES=[{campus:'Bengaluru',role:'academics',name:profile.full_name||profile.email}];
    MY_ACTIVE_DEAN_ROLE='academics';
  }else{
    MY_DEAN_ROLES=deanRows;
    MY_CAMPUS=deanRows[0].campus;
    MY_ACTIVE_DEAN_ROLE=deanRows[0].role;
  }

  /* Derive whether this user holds Dean Academics for MY_CAMPUS. Enables the To finalize tab and panel modes. */
  IS_DEAN_ACADEMICS=MY_DEAN_ROLES.some(r=>r.role==='academics'&&r.campus===MY_CAMPUS);
  if(IS_DEAN_ACADEMICS){
    const tab=document.getElementById('tab-to-finalize');
    if(tab)tab.style.display='';
  }

  document.getElementById('blocker').style.display='none';
  return true;
}

/* ---------- List view ---------- */
async function loadFacultyList(){
  const list=document.getElementById('fac-list');
  list.innerHTML='<div class="fac-empty"><div class="fac-empty-icon">◇</div><span class="fac-empty-strong">Loading...</span></div>';

  /* Pull all submitted evaluations for this dean's campus + AY */
  const{data:evs,error}=await sb.from('faculty_evaluations')
    .select('*,faculty_master:faculty_master_id(id,name,email,campus,designation,subject_area)')
    .eq('academic_year',ACADEMIC_YEAR)
    .in('workflow_status',['submitted','mid_year_locked','dean_review_in_progress','all_deans_complete','with_director','returned_to_dean','director_verified','complete']);
  if(error){dlog('FAC LIST',error);toast('Failed to load list: '+error.message,false);return;}

  /* Filter to this campus */
  const inCampus=(evs||[]).filter(e=>e.faculty_master?.campus===MY_CAMPUS);

  /* Fetch this dean's reviews so we can categorise pending/reviewed */
  const evalIds=inCampus.map(e=>e.id);
  let myReviewsByEval={};
  if(evalIds.length>0){
    const{data:reviews}=await sb.from('evaluation_dean_reviews')
      .select('*')
      .in('evaluation_id',evalIds)
      .eq('dean_email',CURRENT_USER.email);
    (reviews||[]).forEach(r=>{myReviewsByEval[r.evaluation_id]=r;});
  }

  /* Build segments. Self-review filter: a dean does not see their own evaluation in any tab. */
  const myEmail=(CURRENT_USER.email||'').toLowerCase();
  FACULTY_LIST=inCampus
    .filter(ev=>{
      const facEmail=(ev.faculty_master?.email||'').toLowerCase();
      return !(facEmail&&facEmail===myEmail);
    })
    .map(ev=>{
      const myReview=myReviewsByEval[ev.id];
      let seg;
      const ws=ev.workflow_status;
      /* Dean Academics gets a dedicated "to_finalize" bucket for director-returned and director-verified evaluations */
      if(IS_DEAN_ACADEMICS&&(ws==='returned_to_dean'||ws==='director_verified')){
        seg='to_finalize';
      }else if(ws==='complete'){
        seg='finalized';
      }else if(ws==='director_verified'){
        /* Non-Academics deans see director_verified as finalized from their perspective */
        seg='finalized';
      }else if(myReview&&myReview.validated===true){
        seg='reviewed';
      }else{
        seg='pending';
      }
      return{...ev,my_review:myReview,seg};
    });

  /* Counts */
  const pendingCount=FACULTY_LIST.filter(f=>f.seg==='pending').length;
  const reviewedCount=FACULTY_LIST.filter(f=>f.seg==='reviewed').length;
  const toFinalizeCount=FACULTY_LIST.filter(f=>f.seg==='to_finalize').length;
  const finalizedCount=FACULTY_LIST.filter(f=>f.seg==='finalized').length;
  document.getElementById('ct-pending').textContent=pendingCount;
  document.getElementById('ct-reviewed').textContent=reviewedCount;
  document.getElementById('ct-to-finalize').textContent=toFinalizeCount;
  document.getElementById('ct-finalized').textContent=finalizedCount;

  renderList();
}

    let pillHtml='';
    if(SEG==='pending')pillHtml='<span class="pill pill-pending"><span class="pill-dot"></span>Awaiting review</span>';
    else if(SEG==='reviewed')pillHtml='<span class="pill pill-reviewed"><span class="pill-dot"></span>Reviewed</span>';
    else if(SEG==='to_finalize'){
      if(f.workflow_status==='returned_to_dean')pillHtml='<span class="pill pill-returned"><span class="pill-dot"></span>Returned for re-review</span>';

    else pillHtml='<span class="pill pill-finalized"><span class="pill-dot"></span>Finalized</span>';

    row.innerHTML=`
      <div class="fac-row-l">
        <div class="fac-row-name">${escapeHtml(fm.name||'(unknown)')}</div>
        <div class="fac-row-meta">
          <span class="fac-row-meta-item">${escapeHtml(fm.designation||'')}</span>

          ${fm.subject_area?`<span class="fac-row-meta-sep">·</span><span class="fac-row-meta-item">${escapeHtml(fm.subject_area)}</span>`:''}
        </div>

/* ---------- Detail view ---------- */
async function openDetail(f){
  CURRENT_EVAL=f;
  CURRENT_FAC=f.faculty_master||{};

  /* Fetch publications, EP rows, all dean reviews, and the director review row (if any) */
  const[pubs,eps,reviews,dirRev,flags]=await Promise.all([
    sb.from('faculty_publications').select('*').eq('faculty_master_id',CURRENT_FAC.id).eq('academic_year',ACADEMIC_YEAR).order('year',{ascending:false}),
    sb.from('ep_programmes').select('*').eq('faculty_master_id',CURRENT_FAC.id).eq('academic_year',ACADEMIC_YEAR).order('date_conducted',{ascending:false}),
    sb.from('evaluation_dean_reviews').select('*').eq('evaluation_id',f.id),
    sb.from('evaluation_director_reviews').select('*').eq('evaluation_id',f.id).maybeSingle(),
    sb.from('evaluation_entry_flags').select('*').eq('evaluation_id',f.id)
  ]);
  const publications=pubs.data||[];
  const programmes=eps.data||[];
  ALL_REVIEWS=reviews.data||[];
  MY_REVIEW=ALL_REVIEWS.find(r=>r.dean_email===CURRENT_USER.email)||null;
  DIRECTOR_REVIEW=dirRev.data||null;
  ENTRY_FLAGS=flags.data||[];
  FLAGS_EXPANDED={};
  LAST_PUBS=publications;
  LAST_PROGRAMMES=programmes;

  document.getElementById('d-name').textContent=CURRENT_FAC.name||'(unknown)';
  document.getElementById('d-meta').textContent=`${CURRENT_FAC.designation||''} · ${CURRENT_FAC.campus||''} · Submitted ${formatDate(f.gate1_submitted_at||f.updated_at)}`;

  renderDetailContent(f,publications,programmes);
  renderPanel(f,programmes);

  document.getElementById('detail').classList.add('open');
  window.scrollTo(0,0);
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  CURRENT_EVAL=null;CURRENT_FAC=null;MY_REVIEW=null;ALL_REVIEWS=[];DIRECTOR_REVIEW=null;
  loadFacultyList();
}

function renderDetailContent(f,publications,programmes){
  const c=document.getElementById('d-content');
  c.innerHTML='';

  /* Director Comment block at the top in to-finalize modes (Dean Academics view only) */
  if(IS_DEAN_ACADEMICS&&(f.workflow_status==='returned_to_dean'||f.workflow_status==='director_verified')){
    const dirBlock=buildDirectorCommentBlock(f);
    if(dirBlock)c.appendChild(dirBlock);
  }

  /* Section 01 Profile */
  c.appendChild(buildProfileSection(f));
  /* Section 02 Teaching */
  c.appendChild(buildTeachingSection(f));
  /* Section 03 Research & Publications */
  c.appendChild(buildResearchSection(f,publications));
  /* Section 04 Sponsored Research */
  c.appendChild(buildSponsoredSection(f));
  /* Section 05 Industry & EP */
  c.appendChild(buildEpSection(f,programmes));
  /* Section 06 Institution Building */
  c.appendChild(buildInstitutionSection(f));

  /* Reviews from other deans (if any submitted) */
  if(ALL_REVIEWS.filter(r=>r.dean_email!==CURRENT_USER.email&&r.validated).length>0){
    c.appendChild(buildOtherReviewsBlock());
  }
}

/* Build the director's comment block for finalization modes. Surfaces the most recent
   director action (return or verify) with comments, so Dean Academics knows the context. */
function buildDirectorCommentBlock(f){
  const isReturn=f.workflow_status==='returned_to_dean';
  const block=document.createElement('div');
  block.className='dir-block '+(isReturn?'return':'verify');

  const eb=document.createElement('div');eb.className='dir-block-eyebrow';
  eb.textContent=isReturn?'Returned by Director for Re-review':'Verified by Director · Awaiting Management Synthesis';
  block.appendChild(eb);

  const h=document.createElement('div');h.className='dir-block-h';
  h.textContent=isReturn?"Director's note on what needs reconciliation":"Director's verification";
  block.appendChild(h);

  /* Find the latest matching action from action_history, with fallback to current row */
  let comments=null,actedAt=null,actedBy=null;
  const hist=Array.isArray(DIRECTOR_REVIEW?.action_history)?DIRECTOR_REVIEW.action_history:[];
  const wantAction=isReturn?'return':'verify';
  /* iterate backwards to find most recent action of this type */
  for(let i=hist.length-1;i>=0;i--){
    if(hist[i].action===wantAction){
      comments=hist[i].comments;
      actedAt=hist[i].acted_at;
      actedBy=hist[i].director_name||hist[i].director_email;
      break;
    }
  }
  /* fallback to top-level columns if history not yet populated */
  if(!actedAt&&DIRECTOR_REVIEW){
    if(DIRECTOR_REVIEW.action===wantAction){
      comments=DIRECTOR_REVIEW.action_comments;
      actedAt=DIRECTOR_REVIEW.acted_at;
      actedBy=DIRECTOR_REVIEW.director_name||DIRECTOR_REVIEW.director_email;
    }
  }

  const cm=document.createElement('div');cm.className='dir-block-comments'+(comments?'':' empty');
  cm.textContent=comments||'(no specific comments recorded)';
  block.appendChild(cm);

  if(actedAt){
    const f2=document.createElement('div');f2.className='dir-block-foot';
    f2.textContent=`${actedBy||'Director'} · ${formatDate(actedAt)}`;
    block.appendChild(f2);
  }

  return block;
}

function makeSection(num,title,subtitle){
  const sec=document.createElement('div');
  sec.className='sec-block';
  const h=document.createElement('div');h.className='sec-h';
  const n=document.createElement('div');n.className='sec-n';n.textContent=num;
  const wrap=document.createElement('div');
  const ht=document.createElement('div');ht.className='sec-h-t';ht.textContent=title;
  const hs=document.createElement('div');hs.className='sec-h-s';hs.textContent=subtitle;
  wrap.appendChild(ht);wrap.appendChild(hs);
  h.appendChild(n);h.appendChild(wrap);
  sec.appendChild(h);
  return sec;
}

function dataRow(label,value){
  const r=document.createElement('div');r.className='data-row';
  const l=document.createElement('div');l.className='data-label';l.textContent=label;
  const v=document.createElement('div');v.className='data-value';
  if(value===null||value===undefined||value===''){v.classList.add('empty');v.textContent='Not provided';}
  else v.textContent=value;
  r.appendChild(l);r.appendChild(v);
  return r;
}

function narrative(label,text){
  if(!text)return null;
  const w=document.createElement('div');w.className='narrative-block';
  const h=document.createElement('div');h.className='narrative-h';h.textContent=label;
  const t=document.createElement('div');t.className='narrative-t';t.textContent=text;
  w.appendChild(h);w.appendChild(t);
  return w;
}

function buildProfileSection(f){
  const sec=makeSection('01','Profile','From faculty master record and self-reported scholar links');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('Name',f.snap_name||CURRENT_FAC.name));
  grid.appendChild(dataRow('Designation',f.snap_designation||CURRENT_FAC.designation));
  grid.appendChild(dataRow('Campus',f.snap_campus||CURRENT_FAC.campus));
  grid.appendChild(dataRow('Subject Area',f.snap_subject_area||CURRENT_FAC.subject_area));
  grid.appendChild(dataRow('Google Scholar URL',f.scholar_url));
  grid.appendChild(dataRow('ORCID / Scopus ID',f.orcid_id));

  return sec;
}

function buildTeachingSection(f){
  const sec=makeSection('02','Teaching','Course load and teaching context for AY 2025-26');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('Terms Taught',f.terms_taught));
  grid.appendChild(dataRow('Courses Taught (Digii)',f.snap_courses_taught));

function buildResearchSection(f,publications){
  const sec=makeSection('03','Research & Publications','Publications, indices, and library data sources used');
  const grid=document.createElement('div');grid.className='data-grid';
  grid.appendChild(dataRow('H-Index',f.h_index));
  grid.appendChild(dataRow('Google Scholar Citations',f.gscholar_citations));
  grid.appendChild(dataRow('UGC-CARE Listed (legacy)',f.ugc_care_count));
  const ds=Array.isArray(f.data_sources_used)?f.data_sources_used.join(', '):null;
  grid.appendChild(dataRow('Data Sources Used',ds));
  sec.appendChild(grid);
  const wip=narrative('Work in Progress',f.wip_details);
  if(wip)sec.appendChild(wip);
  const ext=narrative('External Resources Needed',f.external_resources_needed);
  if(ext)sec.appendChild(ext);

  /* Publications list */
  if(publications.length>0){
    const h=document.createElement('div');h.className='narrative-h';h.style.marginTop='18px';h.textContent='Publications ('+publications.length+')';
    sec.appendChild(h);
    const list=document.createElement('div');list.className='entry-list';
    publications.forEach(p=>{
      const card=document.createElement('div');card.className='entry-card';
      const hdr=document.createElement('div');hdr.className='entry-card-h';
      const t=document.createElement('div');t.className='entry-card-t';
      t.textContent=(p.publication_type==='conference'?'[Presentation] ':'')+(p.title||'(no title)');
      hdr.appendChild(t);
      const tag=document.createElement('div');tag.className='entry-card-tag';

/* ---------- Entry adjudication (flags) ---------- */
function canFlag(entryType){
  if(CURRENT_USER&&CURRENT_USER.role==='super_admin')return true;
  const remit=FLAG_REMIT[MY_ACTIVE_DEAN_ROLE]||[];
  return remit.includes(entryType);
}
function myFlagFor(entryType,entryId){
  return ENTRY_FLAGS.find(fl=>fl.entry_type===entryType&&String(fl.entry_id)===String(entryId)&&fl.flagged_by===CURRENT_USER.email)||null;
}
function anyFlagsFor(entryType,entryId){
  return ENTRY_FLAGS.filter(fl=>fl.entry_type===entryType&&String(fl.entry_id)===String(entryId));
}
function decorateEntryCard(card,entryType,entryId,title){
  const flags=anyFlagsFor(entryType,entryId);
  if(flags.length>0){
    card.classList.add('flagged');
    flags.forEach(fl=>{
      const r=document.createElement('div');r.className='flag-reason';
      r.innerHTML='<b>Flagged invalid by '+escapeHtml(DEAN_LABELS[fl.flagged_by_role]||fl.flagged_by_role||'Dean')+':</b> '+escapeHtml(fl.reason||'(no reason given)');
      card.appendChild(r);
    });
  }
  if(canFlag(entryType)){
    const mine=myFlagFor(entryType,entryId);
    const btn=document.createElement('button');
    btn.className='entry-flag-btn'+(mine?' on':'');
    btn.textContent=mine?'Flagged \u00B7 undo':'Flag invalid';
    btn.style.marginTop='8px';
    btn.onclick=(ev)=>{ev.stopPropagation();mine?unflagEntry(mine):openFlagDialog(entryType,entryId,title);};
    card.appendChild(btn);
  }
}
function applyCollapse(sectionEl,entryType){
  const cards=[...sectionEl.querySelectorAll('.entry-card.flagged')];
  if(cards.length===0)return;
  const expanded=FLAGS_EXPANDED[entryType]===true;
  cards.forEach(c=>{c.style.display=expanded?'':'none';});
  const list=sectionEl.querySelector('.entry-list');
  if(!list)return;
  const bar=document.createElement('div');bar.className='flag-collapsed';
  const label=document.createElement('span');
  label.textContent=cards.length+(cards.length===1?' entry flagged invalid':' entries flagged invalid');
  const toggle=document.createElement('button');toggle.className='flag-collapsed-toggle';
  toggle.textContent=expanded?'Hide':'Show';
  toggle.onclick=(ev)=>{ev.stopPropagation();FLAGS_EXPANDED[entryType]=!expanded;renderDetailContent(CURRENT_EVAL,LAST_PUBS,LAST_PROGRAMMES);};
  bar.appendChild(label);bar.appendChild(toggle);
  list.parentNode.insertBefore(bar,list);
}
function openFlagDialog(entryType,entryId,title){
  if(document.getElementById('flag-dialog-backdrop'))return;
  const bd=document.createElement('div');bd.className='flag-dialog-backdrop';bd.id='flag-dialog-backdrop';
  bd.innerHTML='<div class="flag-dialog">'+
    '<div class="flag-dialog-h">Flag entry invalid</div>'+
    '<div class="flag-dialog-b"><p>This does not delete the entry. It marks it invalid for the panel, records who flagged it and why, and can be undone. The faculty member\u2019s submission is unchanged.</p>'+
    '<p style="color:var(--text);font-weight:500">'+escapeHtml(title||'')+'</p>'+
    '<textarea id="flag-reason-input" placeholder="Reason (duplicate, miscategorised, not verifiable, and so on)"></textarea></div>'+
    '<div class="flag-dialog-f"><button class="flag-dialog-btn" id="flag-cancel">Cancel</button>'+
    '<button class="flag-dialog-btn danger" id="flag-confirm">Flag invalid</button></div></div>';
  document.body.appendChild(bd);
  const inp=document.getElementById('flag-reason-input');if(inp)inp.focus();
  bd.addEventListener('click',e=>{if(e.target===bd)bd.remove();});
  document.getElementById('flag-cancel').onclick=()=>bd.remove();
  document.getElementById('flag-confirm').onclick=()=>{
    const reason=document.getElementById('flag-reason-input').value.trim();
    bd.remove();
    flagEntry(entryType,entryId,reason);
  };
}
async function flagEntry(entryType,entryId,reason){
  if(!CURRENT_EVAL)return;
  const payload={
    evaluation_id:CURRENT_EVAL.id,
    entry_type:entryType,
    entry_id:String(entryId),
    flag_type:'invalid',
    reason:reason||null,
    flagged_by:CURRENT_USER.email,
    flagged_by_name:MY_DEAN_ROLES.find(d=>d.role===MY_ACTIVE_DEAN_ROLE)?.name||CURRENT_USER.full_name||CURRENT_USER.email,
    flagged_by_role:MY_ACTIVE_DEAN_ROLE,
    campus:MY_CAMPUS,
    updated_at:new Date().toISOString()
  };
  const{data,error}=await sb.from('evaluation_entry_flags')
    .upsert(payload,{onConflict:'evaluation_id,entry_type,entry_id,flagged_by'})
    .select().maybeSingle();
  if(error){dlog('FLAG',error);toast('Could not flag: '+(error.message||'unknown')+'. Tell Girish.',false);return;}
  ENTRY_FLAGS=ENTRY_FLAGS.filter(fl=>!(fl.entry_type===entryType&&String(fl.entry_id)===String(entryId)&&fl.flagged_by===CURRENT_USER.email));
  if(data)ENTRY_FLAGS.push(data);
  FLAGS_EXPANDED[entryType]=true;
  toast('Entry flagged invalid.');
  renderDetailContent(CURRENT_EVAL,LAST_PUBS,LAST_PROGRAMMES);
}
async function unflagEntry(flagRow){
  const{error}=await sb.from('evaluation_entry_flags').delete().eq('id',flagRow.id);
  if(error){dlog('UNFLAG',error);toast('Could not undo: '+(error.message||'unknown')+'. Tell Girish.',false);return;}
  ENTRY_FLAGS=ENTRY_FLAGS.filter(fl=>fl.id!==flagRow.id);
  toast('Flag removed.');
  renderDetailContent(CURRENT_EVAL,LAST_PUBS,LAST_PROGRAMMES);
}

async function submitRereview(){
  if(!CURRENT_EVAL){return;}
  const comments=document.getElementById('dean-comments').value.trim();
  if(!comments){
    toast('Please add updated notes before resubmitting.',false);return;
  }

  const btn=document.getElementById('dean-submit');
  const orig=btn.textContent;
  btn.textContent='Submitting...';btn.disabled=true;

  try{
    const myName=MY_DEAN_ROLES.find(d=>d.role==='academics')?.name||CURRENT_USER.full_name||CURRENT_USER.email;
    const now=new Date().toISOString();

    /* Update the academics dean review row */
    const payload={
      evaluation_id:CURRENT_EVAL.id,
      dean_email:CURRENT_USER.email,
      dean_name:myName,
      dean_role:'academics',
      campus:MY_CAMPUS,
      gate:'annual',
      validated:true,
      validated_at:now,
      notes:comments
    };
    /* Preserve revenue_verified if it exists on the row (shouldn't for academics but defensive) */
    if(MY_REVIEW&&MY_REVIEW.revenue_verified!==undefined&&MY_REVIEW.revenue_verified!==null){
      payload.revenue_verified=MY_REVIEW.revenue_verified;
    }
    const{error:upErr}=await sb.from('evaluation_dean_reviews')
      .upsert(payload,{onConflict:'evaluation_id,dean_email,gate'});
    if(upErr)throw upErr;

    /* Advance workflow_status from returned_to_dean back to with_director */
    const{error:wsErr}=await sb.from('faculty_evaluations')
      .update({workflow_status:'with_director',updated_at:now})
      .eq('id',CURRENT_EVAL.id);
    if(wsErr)throw wsErr;

    CURRENT_EVAL.workflow_status='with_director';
    MY_REVIEW={...payload};
    toast('Resubmitted to Director.');
    /* Detail view stays open but the eval has moved out of this tab on next list reload */
    btn.textContent='Resubmitted';btn.disabled=true;
  }catch(e){
    dlog('SUBMIT REREVIEW',e);
    const code=e.code?` [${e.code}]`:'';
    toast('Resubmit failed'+code+': '+(e.message||'unknown')+'. Tell Girish.',false);
    btn.textContent=orig;btn.disabled=false;
  }
}

    const now=new Date().toISOString();

    const{error}=await sb.from('faculty_evaluations')
      .update({
        management_synthesis:synth,
        management_synthesis_by:CURRENT_USER.email,
        management_synthesis_at:now,
        released_to_faculty_at:now,
        workflow_status:'complete',
        updated_at:now
      })
      .eq('id',CURRENT_EVAL.id);
    if(error)throw error;

    CURRENT_EVAL.workflow_status='complete';
    CURRENT_EVAL.management_synthesis=synth;
    CURRENT_EVAL.management_synthesis_by=CURRENT_USER.email;
    CURRENT_EVAL.management_synthesis_at=now;
    CURRENT_EVAL.released_to_faculty_at=now;

    toast('Released to faculty. Evaluation complete.');
    btn.textContent='Released';btn.disabled=true;
  }catch(e){
    dlog('FINALIZE',e);
    const code=e.code?` [${e.code}]`:'';
    toast('Release failed'+code+': '+(e.message||'unknown')+'. Tell Girish.',false);
    btn.textContent=orig;btn.disabled=false;
  }
}

/* ---------- Complete (read-only) panel (Dean Academics, workflow=complete) ---------- */
function renderCompleteReadonlyPanel(p,f){
  const h=document.createElement('div');h.className='panel-h';h.textContent='Complete';
  p.appendChild(h);

  const role=document.createElement('div');role.className='panel-role';
  role.innerHTML=`<span class="panel-role-dot"></span>Dean Academics · ${escapeHtml(MY_CAMPUS)}`;
  p.appendChild(role);

  const banner=document.createElement('div');banner.className='panel-completed';
  banner.innerHTML=`<strong>Released to faculty.</strong>${f.released_to_faculty_at?'Released '+formatDate(f.released_to_faculty_at)+'.':''} The faculty member can now see the full evaluation.`;
  p.appendChild(banner);

  if(f.management_synthesis){
    const cf=document.createElement('div');cf.className='panel-field';
    const cl=document.createElement('div');cl.className='panel-field-l';
    cl.innerHTML=`<span>Management synthesis (released)</span>`;
    const ta=document.createElement('textarea');ta.className='panel-textarea';
    ta.style.minHeight='180px';
    ta.value=f.management_synthesis;
    ta.readOnly=true;
    cf.appendChild(cl);cf.appendChild(ta);
    p.appendChild(cf);
  }
}

let MY_REVENUE_VERIFIED=null;

function setRevenueVerified(val){
  MY_REVENUE_VERIFIED=val;
  if(MY_REVIEW)MY_REVIEW.revenue_verified=val;
  else MY_REVIEW={revenue_verified:val};
  document.getElementById('rv-yes').className='ep-rev-btn'+(val===true?' active yes':'');
  document.getElementById('rv-no').className='ep-rev-btn'+(val===false?' active no':'');
}

async function submitReview(){
  if(!CURRENT_EVAL){return;}
  const comments=document.getElementById('dean-comments').value.trim();
  if(!comments){
    toast('Please add comments before submitting.',false);return;
  }

  const btn=document.getElementById('dean-submit');
  const orig=btn.textContent;
  btn.textContent='Submitting...';btn.disabled=true;

  try{
    const myCampus=MY_CAMPUS;
    const myRole=MY_ACTIVE_DEAN_ROLE;
    const myName=MY_DEAN_ROLES.find(d=>d.role===myRole)?.name||CURRENT_USER.full_name||CURRENT_USER.email;

    const payload={
      evaluation_id:CURRENT_EVAL.id,
      dean_email:CURRENT_USER.email,
      dean_name:myName,
      dean_role:myRole,
      campus:myCampus,
      gate:'annual',
      validated:true,
      validated_at:new Date().toISOString(),
      notes:comments
    };
    /* EP-specific field */
    if(myRole==='ep'&&MY_REVENUE_VERIFIED!==null){
      payload.revenue_verified=MY_REVENUE_VERIFIED;
    }else if(MY_REVIEW&&MY_REVIEW.revenue_verified!==undefined){
      payload.revenue_verified=MY_REVIEW.revenue_verified;
    }

    const{error}=await sb.from('evaluation_dean_reviews')
      .upsert(payload,{onConflict:'evaluation_id,dean_email,gate'});
    if(error)throw error;

    /* Update workflow_status on the eval row if first dean to complete */
    await maybeAdvanceWorkflow();

    toast('Review submitted.');
    document.getElementById('dean-saved').classList.add('show');
    document.getElementById('dean-saved').textContent='Saved just now';
    btn.textContent='Update Review';btn.disabled=false;

    /* Refresh local state */
    MY_REVIEW={...payload};
  }catch(e){
    dlog('SUBMIT REVIEW',e);
    const code=e.code?` [${e.code}]`:'';
    toast('Submit failed'+code+': '+(e.message||'unknown')+'. Tell Girish.',false);
    btn.textContent=orig;btn.disabled=false;
  }
}

async function maybeAdvanceWorkflow(){
  /* Re-read all reviews. Advance to all_deans_complete when every dean role ACTUALLY
     ASSIGNED to this evaluation has at least one validated review. Counts the roles
     present on this evaluation's dean_review rows rather than a fixed
     academics+research+ep triple, so the AY 2025-26 recipient model (Dean Academics
     + Dean Research, EP retired) advances correctly. Tolerant of duplicate rows of
     the same role. Falls back to dean_review_in_progress while reviews are outstanding. */
  const{data:rs}=await sb.from('evaluation_dean_reviews').select('dean_role,validated').eq('evaluation_id',CURRENT_EVAL.id);
  const rows=rs||[];
  const assignedRoles=new Set(rows.map(r=>r.dean_role));
  const validatedRoles=new Set(rows.filter(r=>r.validated).map(r=>r.dean_role));
  const allDone=assignedRoles.size>0&&[...assignedRoles].every(role=>validatedRoles.has(role));

  let newStatus=null;
  const currentStatus=CURRENT_EVAL.workflow_status;
  if(allDone){
    if(currentStatus!=='with_director'&&currentStatus!=='returned_to_dean'&&currentStatus!=='director_verified'&&currentStatus!=='complete'){
      newStatus='all_deans_complete';
    }
  }else{
    if(currentStatus==='submitted'||currentStatus==='mid_year_locked'){
      newStatus='dean_review_in_progress';
    }
  }
  if(newStatus){
    await sb.from('faculty_evaluations').update({workflow_status:newStatus}).eq('id',CURRENT_EVAL.id);
    CURRENT_EVAL.workflow_status=newStatus;
  }
}

/* ---------- Init ---------- */
async function init(){
  const access=await resolveAccess();
  if(!access)return;

  const myName=MY_DEAN_ROLES[0]?.name||CURRENT_USER.full_name||CURRENT_USER.email;
  document.getElementById('hero-t').innerHTML='Welcome, <em>'+escapeHtml(myName)+'</em>';
  document.getElementById('hero-l').textContent=`${DEAN_LABELS[MY_ACTIVE_DEAN_ROLE]||MY_ACTIVE_DEAN_ROLE} · ${MY_CAMPUS} · AY 2025-26`;
  document.getElementById('hero-s').textContent=DEAN_FOCUS[MY_ACTIVE_DEAN_ROLE]||'Review performance evaluations submitted by faculty.';

  await loadFacultyList();
}

init();
