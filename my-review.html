<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Hub · My Review</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<script src="assets/js/supabase-js-2.105.4.umd.js"></script>
<style>
:root{
  --navy:#0D1F35;--navy-dark:#0A1828;
  --gold:#C9A84C;--gold-d:#7A6118;
  --paper:#FBFAF6;--cream:#F4F2EA;--parchment:#F8F6EE;
  --ink:#0F0F0E;--charcoal:#1F1F1F;--mute:#4A5568;--faint:#6B7280;
  --line:#D8D4C7;--border-g:rgba(201,168,76,.45);
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}

.topbar{background:var(--navy);padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;border-bottom:3px solid var(--gold)}
.tb-l{display:flex;align-items:center;gap:14px;flex-shrink:0}
.tb-logo{height:28px;width:auto;display:block;flex-shrink:0}
.sep{width:1px;height:22px;background:rgba(255,255,255,.18)}
.ttl{font-size:11px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.04em}
.tb-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tbtn{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;padding:6px 14px;border-radius:var(--rs);cursor:pointer;transition:all .15s;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.75)}
.tbtn:hover{background:rgba(255,255,255,.1);color:#fff}

.preview-banner{background:rgba(239,159,39,.15);border-bottom:1px solid rgba(239,159,39,.4);padding:10px 24px;display:none;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:#4A2900;position:sticky;top:62px;z-index:150}
.preview-banner.visible{display:flex}
.preview-banner strong{font-weight:600}
.preview-banner a{color:#4A2900;text-decoration:underline;cursor:pointer;font-weight:500}

.wrap{max-width:780px;margin:0 auto;padding:34px 28px 90px;width:100%}
.blocking{padding:70px 24px;text-align:center;color:var(--faint);font-size:13px}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:8px;flex-wrap:wrap}
.head-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--navy);line-height:1.1}
.head-role{font-size:12.5px;color:var(--mute);margin-top:4px}
.print-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--rs);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--charcoal);font-weight:500;transition:all .15s;white-space:nowrap}
.print-btn:hover{border-color:var(--gold);background:var(--parchment);color:var(--gold-d)}
.print-btn-icon{font-size:15px;line-height:1;color:var(--gold-d)}

.cycles{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 4px}
.cycle-chip{padding:6px 14px;font-size:11.5px;font-weight:500;background:#fff;border:1px solid var(--line);color:var(--mute);cursor:pointer;border-radius:20px;font-family:'DM Mono',monospace;letter-spacing:.03em;transition:all .15s;text-decoration:none}
.cycle-chip:hover{border-color:var(--gold-d);color:var(--gold-d)}
.cycle-chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.cpkt{background:var(--parchment);border:1px solid var(--border-g);border-left:4px solid var(--gold);border-radius:var(--r);padding:28px 32px;margin-top:18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.cpkt-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cpkt-eyebrow-released{color:var(--mute);font-weight:400;letter-spacing:.06em;text-transform:none;font-size:10.5px}
.cpkt-h{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;color:var(--navy);line-height:1.2;margin-bottom:6px}
.cpkt-lead{font-size:12.5px;color:var(--mute);margin-bottom:14px;line-height:1.6}
.cpkt-text{font-size:14.5px;color:var(--ink);line-height:1.8;white-space:pre-wrap;background:#fff;border:.5px solid var(--line);border-radius:var(--rs);padding:20px 22px}

.state-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:34px 32px;margin-top:18px;text-align:center}
.state-icon{font-size:30px;color:var(--gold-d);margin-bottom:10px}
.state-h{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--navy);margin-bottom:8px}
.state-s{font-size:13px;color:var(--mute);line-height:1.7;max-width:480px;margin:0 auto}
.state-link{display:inline-block;margin-top:18px;background:var(--navy);color:#fff;text-decoration:none;font-size:12.5px;font-weight:500;padding:10px 20px;border-radius:var(--rs)}
.state-link:hover{background:var(--gold);color:var(--navy-dark)}

@media(max-width:640px){
  .wrap{padding:24px 16px 70px}
  .cpkt{padding:22px 18px}
  .head-name{font-size:25px}
}
@media print{
  .topbar,.preview-banner,.print-btn,.cycles,.tbtn{display:none !important}
  body{background:#fff}
  .wrap{padding:0;max-width:100%}
  .cpkt{box-shadow:none;border-left-width:3px}
  .wrap::before{content:"XIME Faculty Performance Summary";display:block;font-family:'Cormorant Garamond',serif;font-size:18pt;color:#0e1828;text-align:center;border-bottom:2px solid #c9a84c;padding-bottom:8pt;margin-bottom:14pt;font-weight:600}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-l">
    <img src="assets/logo/XIME_LOGO_WHITE.svg" alt="XIME" class="tb-logo">
    <div class="sep"></div>
    <div class="ttl">X-Hub · <strong>My Review</strong></div>
  </div>
  <div class="tb-r">
    <button class="tbtn" onclick="window.location.href='index.html'" style="opacity:.7">&larr; Home</button>
    <button class="tbtn" onclick="signOut()" style="opacity:.7">Sign out</button>
  </div>
</div>

<div class="preview-banner" id="preview-banner">
  <div><strong id="preview-who">Super Admin Preview</strong> · Viewing this faculty member's released summary, read-only.</div>
  <a onclick="exitPreview()">Exit preview &rarr;</a>
</div>

<div id="blocker" class="blocking">Verifying access...</div>

<div class="wrap" id="wrap" style="display:none">
  <div class="head">
    <div>
      <div class="head-name" id="h-name">Loading...</div>
      <div class="head-role" id="h-role"></div>
    </div>
    <button class="print-btn" id="print-btn" onclick="window.print()" style="display:none">
      <span class="print-btn-icon">&#128424;</span> Print / Save as PDF
    </button>
  </div>

  <div class="cycles" id="cycles" style="display:none"></div>

  <div id="content"></div>
</div>

<script>
const SU='https://qcufrukhfcmyfvwwoqjo.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjdWZydWtoZmNteWZ2d3dvcWpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjI0MTEsImV4cCI6MjA5MDY5ODQxMX0.sswZ6e-mCvHznWmu8p7fm0AbRrlaRfM0jvpA2ppNlWI';
const sb=supabase.createClient(SU,SK);

/* Default cycle when no ?ay= is supplied. The page also falls back to the
   latest released cycle the faculty actually has. */
const DEFAULT_AY='2025-26';

/* Columns the faculty is allowed to see. Deliberately explicit: we never
   select '*', so internal panel data (ratings, potential, promotion) never
   reaches the browser. The ratings live in a separate table the database
   does not serve to faculty at all. */
const FACULTY_COLS='id,academic_year,workflow_status,panel_final_review,released_to_faculty_at';

const DEBUG=false;
function dlog(...a){if(DEBUG)console.error(...a);}

let CURRENT_USER=null,USER_ROLE='',IS_PREVIEW=false;
let fac=null;
let COMPLETED=[];
let SELECTED_AY=null;

function esc(s){return(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(s){if(!s)return '';try{return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});}catch(e){return s;}}

async function signOut(){await sb.auth.signOut();window.location.href='login.html';}
function exitPreview(){const u=new URL(window.location.href);u.searchParams.delete('as');window.location.href='index.html';}

async function resolveAccess(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return null;}

  const{data:authProfile}=await sb.from('user_profiles')
    .select('must_change_password').eq('id',session.user.id).maybeSingle();
  if(authProfile?.must_change_password===true){window.location.href='login.html?force_change=1';return null;}

  const{data:profile}=await sb.from('user_profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile){window.location.href='login.html';return null;}

  CURRENT_USER=profile;USER_ROLE=profile.role;

  const params=new URLSearchParams(window.location.search);
  const asEmail=USER_ROLE==='super_admin'?params.get('as'):null;
  const targetEmail=asEmail||profile.email;

  if(USER_ROLE==='fdp_user'||USER_ROLE==='dean'||USER_ROLE==='director'){
    const{data:ownRow}=await sb.from('faculty_master').select('*').eq('email',profile.email).maybeSingle();
    if(!ownRow){block('Your faculty profile is not linked to the review system yet. Please contact your Director.');return null;}
    return{faculty:ownRow,isPreview:false};
  }

  if(USER_ROLE==='super_admin'){
    /* Explicit preview only. Never auto-pick a faculty member for an admin who
       has no review of their own (e.g. the President). The old fallback picked
       the alphabetically-first faculty, which dropped the President onto whoever
       sorted first. */
    if(!asEmail){
      const{data:ownRow}=await sb.from('faculty_master').select('*').eq('email',profile.email).maybeSingle();
      if(ownRow)return{faculty:ownRow,isPreview:false};
      block('Super admin preview. Add ?as=faculty@xime.org to the web address to view a specific faculty member\u2019s released summary.');
      return null;
    }
    const{data:row}=await sb.from('faculty_master').select('*').eq('email',asEmail).maybeSingle();
    if(!row){block('No faculty member found for '+asEmail+'.');return null;}
    return{faculty:row,isPreview:asEmail!==profile.email};
  }

  window.location.href='index.html';
  return null;
}

function block(msg){
  const b=document.getElementById('blocker');
  b.textContent=msg;b.style.display='block';
  document.getElementById('wrap').style.display='none';
}

function renderCycles(){
  const el=document.getElementById('cycles');
  if(COMPLETED.length<=1){el.style.display='none';return;}
  el.style.display='flex';
  el.innerHTML='';
  COMPLETED.forEach(r=>{
    const a=document.createElement('a');
    a.className='cycle-chip'+(r.academic_year===SELECTED_AY?' active':'');
    a.textContent='AY '+(r.academic_year||'');
    a.href='javascript:void(0)';
    a.onclick=()=>{SELECTED_AY=r.academic_year;renderCycles();renderSelected();};
    el.appendChild(a);
  });
}

/* Faculty see only the written performance summary. No rating, no potential,
   no promotion line, no dean comments. Those are recorded by the panel and
   held internally, in a separate table this page never queries. */
function renderSelected(){
  const content=document.getElementById('content');
  const printBtn=document.getElementById('print-btn');
  const rec=COMPLETED.find(r=>r.academic_year===SELECTED_AY);

  if(!rec){
    printBtn.style.display='none';
    content.innerHTML=
      '<div class="state-card">'+
        '<div class="state-icon">&#9201;</div>'+
        '<div class="state-h">No summary released yet</div>'+
        '<div class="state-s">Your AY '+esc(SELECTED_AY||DEFAULT_AY)+' performance summary has not been released yet. '+
        'Once the review panel has met and the Director has written your summary, you will be able to read it here. '+
        'Your submitted record stays editable until the deadline on the X-Drive form.</div>'+
        '<a class="state-link" href="evaluation.html">Go to my X-Drive form &rarr;</a>'+
      '</div>';
    return;
  }

  printBtn.style.display='inline-flex';

  const summary=rec.panel_final_review||'(No summary was recorded.)';
  const releasedAt=rec.released_to_faculty_at?fmtDate(rec.released_to_faculty_at):'';

  content.innerHTML=
    '<div class="cpkt">'+
      '<div class="cpkt-eyebrow"><span>Annual Evaluation \u00B7 AY '+esc(rec.academic_year||'')+' \u00B7 Complete</span>'+
      (releasedAt?'<span class="cpkt-eyebrow-released">Released to you on '+esc(releasedAt)+'</span>':'')+'</div>'+
      '<div class="cpkt-h">Performance Summary</div>'+
      '<div class="cpkt-lead">A summary of your year, written by the Director following the annual review panel.</div>'+
      '<div class="cpkt-text">'+esc(summary)+'</div>'+
    '</div>';
}

async function init(){
  const access=await resolveAccess();
  if(!access)return;
  fac=access.faculty;IS_PREVIEW=access.isPreview;

  document.getElementById('blocker').style.display='none';
  document.getElementById('wrap').style.display='block';

  document.getElementById('h-name').textContent=fac.name||'';
  document.getElementById('h-role').textContent=[fac.designation,fac.campus].filter(Boolean).join(' \u00B7 ');

  if(IS_PREVIEW){
    const banner=document.getElementById('preview-banner');
    banner.classList.add('visible');
    document.getElementById('preview-who').textContent='Super Admin Preview: '+(fac.name||'');
  }

  const{data,error}=await sb.from('faculty_evaluations')
    .select(FACULTY_COLS)
    .eq('faculty_master_id',fac.id)
    .eq('workflow_status','complete')
    .order('academic_year',{ascending:false});
  if(error){dlog('LOAD',error);}
  COMPLETED=data||[];

  const params=new URLSearchParams(window.location.search);
  const wantAy=params.get('ay');
  if(wantAy&&COMPLETED.some(r=>r.academic_year===wantAy))SELECTED_AY=wantAy;
  else if(COMPLETED.length>0)SELECTED_AY=COMPLETED[0].academic_year;
  else SELECTED_AY=wantAy||DEFAULT_AY;

  renderCycles();
  renderSelected();
}

init();
</script>
</body>
</html>
