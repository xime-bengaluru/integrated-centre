<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>APC Research Dean</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--navy:#0D1F35;--navy2:#1F2A3D;--gold:#C9A84C;--parch:#FAF8F3;--ink:#0D1F35;--muted:#5b6472;--line:#e4ded1;--card:#fff;--good:#2f7d4f;--bad:#b23b3b;--warn:#8f6f2f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--parch);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.top{background:var(--navy);color:#fff}.top .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
.brand{display:flex;align-items:center;gap:16px}.brand svg{height:32px;width:auto;display:block}
.brand .rule{width:1px;height:30px;background:rgba(255,255,255,.25)}
.brand .name{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600}
.who{font-family:"DM Mono",monospace;font-size:13px;color:rgba(255,255,255,.7)}.who a{color:var(--gold);text-decoration:none;margin-left:14px}
.login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px 34px;box-shadow:0 12px 40px rgba(13,31,53,.08)}
.login h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:32px;margin:0 0 6px}.login p.sub{margin:0 0 26px;color:var(--muted);font-size:16px}
.oauth{width:100%;background:#fff;color:#3c4043;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-weight:600;font-size:16px;padding:12px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.oauth:hover{background:#f7f7f7}.oauth:disabled{opacity:.55}.oauth svg{width:19px;height:19px}
.err{color:var(--bad);font-size:14px;margin-top:14px;min-height:18px}
.intro{padding:30px 0 6px}.eyebrow{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.intro h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:36px;line-height:1.05;margin:0 0 8px}.intro p{margin:0;color:var(--muted);font-size:17px;max-width:64ch}
label{display:block;font-weight:600;font-size:15px;margin:16px 0 6px}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.row{grid-template-columns:1fr}}
.primary{background:var(--navy);color:#fff;border:0;border-radius:9px;font-family:inherit;font-weight:600;font-size:16px;padding:12px 22px;cursor:pointer}.primary:hover{background:var(--navy2)}
.gold{background:var(--gold);color:var(--navy);border:0;border-radius:9px;font-family:inherit;font-weight:700;font-size:16px;padding:12px 22px;cursor:pointer}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:9px;font-family:inherit;font-weight:600;font-size:15px;padding:10px 18px;cursor:pointer}
.ghost:hover{border-color:var(--gold);color:var(--navy)}
.hidden{display:none}
.badge{display:inline-block;font-family:"DM Mono",monospace;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.b-draft{background:#f3f1ea;color:var(--muted)}
.b-dean_review,.b-director_review,.b-president_review{background:#fdf6e3;color:var(--warn);border-color:#e8d9a8}
.b-approved{background:#eaf3ec;color:var(--good);border-color:#bfe0c8}
.b-rejected{background:#f7e9e9;color:var(--bad);border-color:#e6bcbc}

.b-cope_review{background:#fdf6e3;color:var(--warn);border-color:#e8d9a8}
.b-cope_approved,.b-accepted{background:#eaf3ec;color:var(--good);border-color:#bfe0c8}
.b-cope_rejected{background:#f7e9e9;color:var(--bad);border-color:#e6bcbc}
.b-claim_submitted{background:#fdf6e3;color:var(--warn);border-color:#e8d9a8}
.b-claim_approved,.b-reimbursed,.b-closed{background:#eaf3ec;color:var(--good);border-color:#bfe0c8}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 16px;box-shadow:0 4px 18px rgba(13,31,53,.05)}
.card h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:23px;margin:0 0 2px}
.card .meta{font-size:14px;color:var(--muted);margin:0 0 8px;font-family:"DM Mono",monospace}
.stage{display:flex;align-items:center;gap:8px;margin:14px 0;font-size:13px;font-family:"DM Mono",monospace;color:var(--muted);flex-wrap:wrap}
.stage .step{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fbf9f3}
.stage .step.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.stage .step.now{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
.stage .arw{color:var(--line)}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;font-size:15px;margin:10px 0}
.kv .k{color:var(--muted)}
.kv a{color:var(--navy);text-decoration:underline}
.timeline{border-left:2px solid var(--line);margin:12px 0 0;padding:0 0 0 16px}
.timeline .ev{margin:0 0 10px;font-size:14px}
.timeline .ev .t{font-family:"DM Mono",monospace;color:var(--muted);font-size:12px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.cap{font-size:13px;color:var(--muted);margin-top:4px}
.amt{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:20px;color:var(--navy)}
</style></head><body>

<script>

async function gauth(){const gb=$("#googleBtn");$("#loginErr").textContent="";gb.disabled=true;
  const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{hd:"xime.org",prompt:"select_account"}}});

const STATUS_LABEL={draft:"Draft",dean_review:"With research dean",director_review:"With director",president_review:"With President",approved:"Approved",rejected:"Declined",accepted:"Paper accepted",claim_submitted:"Claim submitted",claim_approved:"Claim approved",reimbursed:"Reimbursed",closed:"Closed"};
function quartileCap(q){return q==="Q1"?100000:q==="Q2"?75000:50000;}
function detailKV(r){return `<div class="kv">
  <span class="k">Faculty</span><span>${esc(r.faculty_email)} &middot; ${esc(r.campus||"")}</span>
  <span class="k">Author position</span><span>${esc(r.author_position)}</span>
  <span class="k">Co-authors</span><span>${esc(r.co_authors||"-")}</span>
  <span class="k">Estimated APC</span><span>${rupee(r.estimated_apc)}</span>
  ${r.proposal_link?`<span class="k">Manuscript</span><span><a href="${esc(r.proposal_link)}" target="_blank" rel="noopener">open link</a></span>`:''}
  ${r.acceptance_link?`<span class="k">Acceptance</span><span><a href="${esc(r.acceptance_link)}" target="_blank" rel="noopener">open link</a></span>`:''}
  ${r.abstract?`<span class="k">Abstract</span><span>${esc(r.abstract)}</span>`:''}
  ${r.recommend_note?`<span class="k">Research dean</span><span>${esc(r.recommend_note)}</span>`:''}
  ${r.support_note?`<span class="k">Director</span><span>${esc(r.support_note)}</span>`:''}
</div>`;}

let ME=null,REQS=[],FILTER="action";
const ROLE="dean",ACTION_STATE="dean_review";
$("#googleBtn").addEventListener("click",gauth);
$("#signout").addEventListener("click",async e=>{e.preventDefault();await sb.auth.signOut();location.reload();});
sb.auth.getSession().then(({data})=>{if(data.session)boot(data.session.user.email);});
async function boot(email){const {data:ok}=await sb.rpc("apc_research_dean_campuses");
  if(!ok || !ok.length){$("#loginErr").textContent="Signed in as "+email+". This console is for research deans. Faculty apply at centre.xime.org/apc.html";await sb.auth.signOut();return;}
  const {data:fm}=await sb.from("faculty_master").select("name").eq("email",email).maybeSingle();
  ME={email,name:(fm&&fm.name)||email};$("#loginView").classList.add("hidden");$("#appView").classList.remove("hidden");$("#whoName").textContent=ME.name;await load();}
$("#filterSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;FILTER=b.dataset.f;
  [...$("#filterSeg").children].forEach(x=>x.className=x===b?"primary":"ghost");renderList();});
async function load(){const {data}=await sb.from("apc_request").select("*").order("updated_at",{ascending:false});REQS=data||[];renderList();}
function renderList(){const el=$("#list");
  let rows=FILTER==="action"?REQS.filter(r=>r.status===ACTION_STATE):REQS;
  if(!rows.length){el.innerHTML='<div class="empty">Nothing '+(FILTER==="action"?"waiting on you":"here")+' right now.</div>';return;}
  el.innerHTML=rows.map(r=>card(r)).join('');wire();}
function card(r){const act=r.status===ACTION_STATE;return `<div class="card" data-id="${r.request_id}">
  <div style="display:flex;justify-content:space-between;gap:12px"><div><h3>${esc(r.manuscript_title)}</h3>
    <p class="meta">${esc(r.faculty_email)} &middot; ${esc(r.journal_name)} &middot; ${esc(r.journal_quartile)}</p></div>
    <span class="badge b-${r.status}">${STATUS_LABEL[r.status]||r.status}</span></div>
  ${detailKV(r)}
  ${act?actionBlock(r):''}
  </div>`;}
function actionBlock(r){return `<label>Recommendation note (optional)</label><input class="note" placeholder="Why this merits support">
  <div class="actions"><button class="gold" data-act="recommend">Recommend to director</button><button class="ghost" data-act="reject">Decline</button></div>`;}
function wire(){
  document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>decide(b)));}
async function decide(b){const card=b.closest(".card");const id=card.dataset.id;const r=REQS.find(x=>x.request_id===id);const act=b.dataset.act;
  let upd={},evt="",note=card.querySelector(".note")?.value.trim()||"";
  if(act==="recommend"){upd={status:"director_review",recommended_by:ME.email,recommended_at:new Date().toISOString(),recommend_note:note};evt="recommended";}
  if(act==="reject"){upd={status:"rejected",recommended_by:ME.email,recommended_at:new Date().toISOString(),recommend_note:note};evt="rejected_by_dean";}
  b.disabled=true;const {error}=await sb.from("apc_request").update(upd).eq("request_id",id);
  if(error){alert(error.message);b.disabled=false;return;}
  await sb.from("apc_event").insert({request_id:id,actor_email:ME.email,action:evt,note:note});await load();}
