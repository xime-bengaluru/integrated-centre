<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Commitment Each — Live Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111111;--surface:#1a1a1a;--surface2:#222222;
  --red:#cc2229;--gold:#c9a84c;--gold-40:rgba(201,168,76,0.40);
  --white:#f0ede8;--dim:rgba(240,237,232,0.50);--muted:rgba(240,237,232,0.25);
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--white);
  font-family:"DM Sans",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2.5rem;border-bottom:1px solid rgba(240,237,232,0.08);
  background:rgba(17,17,17,0.95);backdrop-filter:blur(8px)}
.header-logo svg{height:22px;width:auto}
.header-center{text-align:center}
.header-title{font-family:"Cormorant Garamond",serif;font-size:1.2rem;font-weight:300;
  color:var(--white);letter-spacing:0.5px}
.header-sub{font-size:0.62rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.header-right{display:flex;align-items:center;gap:1rem}
.count-badge{background:var(--red);border-radius:20px;padding:3px 12px;
  font-family:"DM Mono",monospace;font-size:0.78rem;color:var(--white);letter-spacing:1px}
.count-label{font-size:0.6rem;color:var(--muted);letter-spacing:1px;text-align:right}

/* WALL */
.wall{position:fixed;top:68px;left:0;right:0;bottom:60px;
  padding:1.5rem 2rem;overflow-y:auto;
  display:flex;flex-direction:column;gap:0}
.wall::-webkit-scrollbar{width:4px}
.wall::-webkit-scrollbar-track{background:transparent}
.wall::-webkit-scrollbar-thumb{background:rgba(240,237,232,0.15);border-radius:2px}

/* COMMITMENT CARDS */
.commit-card{display:flex;gap:1rem;align-items:flex-start;
  padding:0.9rem 0;border-bottom:1px solid rgba(240,237,232,0.06);
  opacity:0;transform:translateY(12px);
  animation:fadeUp 0.5s ease forwards}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}}
.commit-num{font-family:"DM Mono",monospace;font-size:0.65rem;
  color:var(--red);letter-spacing:1px;flex-shrink:0;
  padding-top:3px;min-width:28px}
.commit-body{}
.commit-text{font-family:"Cormorant Garamond",serif;
  font-size:clamp(1rem,1.8vw,1.4rem);font-weight:300;
  color:var(--white);line-height:1.5;font-style:italic}
.commit-meta{font-size:0.6rem;color:var(--muted);letter-spacing:1px;
  margin-top:4px;text-transform:uppercase}

/* EMPTY STATE */
.empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:0.15}
.empty-text{font-family:"Cormorant Garamond",serif;font-size:1.6rem;
  font-weight:300;color:var(--dim);font-style:italic}
.empty-sub{font-size:0.72rem;color:var(--muted);letter-spacing:1px;margin-top:0.5rem}

/* FOOTER */
.footer{position:fixed;bottom:0;left:0;right:0;height:52px;
  background:rgba(17,17,17,0.95);border-top:1px solid rgba(240,237,232,0.08);
  display:flex;align-items:center;justify-content:center;gap:2rem;padding:0 2rem}
.footer-prompt{font-family:"Cormorant Garamond",serif;font-size:1rem;
  font-weight:300;color:var(--dim);font-style:italic}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);
  animation:pulse-dot 2s ease-in-out infinite;flex-shrink:0}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
.live-label{font-size:0.6rem;color:var(--red);letter-spacing:2px;text-transform:uppercase}

/* CLEAR BTN (for facilitator) */
.clear-btn{position:fixed;bottom:12px;right:1.5rem;z-index:200;
  background:rgba(204,34,41,0.15);border:1px solid rgba(204,34,41,0.30);
  color:rgba(204,34,41,0.60);font-family:"DM Sans",sans-serif;
  font-size:0.6rem;letter-spacing:1px;padding:4px 10px;border-radius:3px;
  cursor:pointer;transition:all 0.2s;text-transform:uppercase}
.clear-btn:hover{background:rgba(204,34,41,0.25);color:var(--red)}
</style>
</head>

<button class="clear-btn" onclick="confirmClear()">Clear wall</button>

<script>
const SUPA_URL = 'https://qcufrukhfcmyfvwwoqjo.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjdWZydWtoZmNteWZ2d3dvcWpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMjI0MTEsImV4cCI6MjA5MDY5ODQxMX0.sswZ6e-mCvHznWmu8p7fm0AbRrlaRfM0jvpA2ppNlWI';
const { createClient } = supabase;
const client = createClient(SUPA_URL, SUPA_KEY);

let commitments = [];

function renderWall() {
  const wall = document.getElementById('wall');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');
  countEl.textContent = commitments.length;
  
  if (commitments.length === 0) {
    empty.style.display = 'block';
    // Remove all cards
    wall.querySelectorAll('.commit-card').forEach(c => c.remove());
    return;
  }
  empty.style.display = 'none';
}

function addCard(commit, prepend) {
  const wall = document.getElementById('wall');
  const card = document.createElement('div');
  card.className = 'commit-card';
  card.id = 'commit-' + commit.id;
  card.style.animationDelay = prepend ? '0s' : '0s';
  
  const num = document.createElement('span');
  num.className = 'commit-num';
  num.textContent = String(commitments.length).padStart(2,'0');
  
  const body = document.createElement('div');
  body.className = 'commit-body';
  
  const text = document.createElement('p');
  text.className = 'commit-text';
  text.textContent = commit.text;
  
  body.appendChild(text);
  
  if (commit.campus || commit.display_name) {
    const meta = document.createElement('p');
    meta.className = 'commit-meta';
    meta.textContent = [commit.display_name, commit.campus].filter(Boolean).join(' · ');
    body.appendChild(meta);
  }
  
  card.appendChild(num);
  card.appendChild(body);
  
  if (prepend) {
    const firstCard = wall.querySelector('.commit-card');
    if (firstCard) wall.insertBefore(card, firstCard);
    else wall.appendChild(card);
    wall.scrollTop = 0;
  } else {
    wall.appendChild(card);
    // Auto-scroll to latest
    setTimeout(() => wall.scrollTo({top: wall.scrollHeight, behavior: 'smooth'}), 100);
  }
}

async function loadAll() {
  const { data, error } = await client
    .from('fdp_commitments')
    .select('*')
    .order('created_at', { ascending: true });
  
  if (data) {
    commitments = data;
    renderWall();
    data.forEach(c => addCard(c, false));
    document.getElementById('count').textContent = commitments.length;
  }
}

// Real-time subscription
client
  .channel('commitments-wall')
  .on('postgres_changes', 
    { event: 'INSERT', schema: 'public', table: 'fdp_commitments' },
    (payload) => {
      commitments.push(payload.new);
      document.getElementById('empty').style.display = 'none';
      document.getElementById('count').textContent = commitments.length;
      addCard(payload.new, false);
    }
  )
  .on('postgres_changes',
    { event: 'DELETE', schema: 'public', table: 'fdp_commitments' },
    () => {
      commitments = [];
      document.getElementById('wall').querySelectorAll('.commit-card').forEach(c => c.remove());
      renderWall();
    }
  )
  .subscribe();

async function confirmClear() {
  if (!confirm('Clear all commitments from the wall? This cannot be undone.')) return;
  await client.from('fdp_commitments').delete().neq('id', '00000000-0000-0000-0000-000000000000');
  commitments = [];
  document.getElementById('wall').querySelectorAll('.commit-card').forEach(c => c.remove());
  renderWall();
}

loadAll();
</script>
